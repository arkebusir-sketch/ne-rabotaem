<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6f8">
<title>Перерыв</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a2133;
  --ink-2: #3a4152;
  --grey: #8b8b92;
  --line: rgba(26, 33, 51, .08);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(255, 255, 255, .78);
  --edge: rgba(255, 255, 255, .9);
  --r: 24px;
  --lift: 0 1px 1px rgba(26,33,51,.04), 0 12px 32px -14px rgba(26,33,51,.22);
  --wide: 0 2px 4px rgba(26,33,51,.03), 0 40px 120px -30px rgba(26,33,51,.28);
  --serif: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Geist", "Inter", system-ui, sans-serif; font-weight: 400; font-size: 15px; line-height: 1.45;
  color: var(--ink); overflow: hidden;
  background: radial-gradient(120% 120% at 50% 45%, #f9fbfb 0%, #f6f7f8 45%, #f2f3f6 100%);
}
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 10px; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 500; }

/* ===== Пол студии: размытые плитки-логотипы за стеклом ===== */
.bokeh { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bokeh i { position: absolute; border-radius: 28%; animation: drift 26s ease-in-out infinite alternate; }
.bokeh i:nth-child(1) { width: 360px; height: 360px; left: -90px; bottom: -110px; background: #c9d6ff; filter: blur(70px); opacity: .9; }
.bokeh i:nth-child(2) { width: 300px; height: 300px; right: -70px; bottom: -80px; background: #ffd9c7; filter: blur(70px); animation-delay: -9s; }
.bokeh i:nth-child(3) { width: 220px; height: 220px; right: 18%; top: -90px; background: #cff1e1; filter: blur(60px); animation-delay: -4s; }
.bokeh i:nth-child(4) { width: 180px; height: 180px; left: 22%; top: 12%; background: #eadcff; filter: blur(64px); animation-delay: -15s; }
@keyframes drift { to { transform: translate(28px, -22px) rotate(8deg); } }

/* ===== Логотип ===== */
.mark { width: 22px; height: 22px; flex: none; }
.tile { position: fixed; z-index: 1; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
  background: linear-gradient(160deg, #ffffff, #eef0f5); box-shadow: var(--lift); pointer-events: none; animation: bob 9s ease-in-out infinite alternate; }
.tile .mark { width: 30px; height: 30px; }
.tile.soft { filter: blur(6px); opacity: .7; }
@keyframes bob { to { transform: translateY(-10px) rotate(-4deg); } }

/* ===== Окно ===== */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  border: 1px solid var(--edge); box-shadow: var(--wide);
}
#app {
  position: fixed; z-index: 2; inset: 0; margin: auto; width: min(1180px, calc(100vw - 64px)); height: min(780px, calc(100vh - 64px));
  border-radius: var(--r); display: grid; grid-template-columns: 340px 1fr; overflow: hidden;
  transition: filter .7s var(--ease), transform .9s var(--ease), opacity .6s;
}
body.locked #app { filter: blur(14px); transform: translateY(18px) scale(.97); opacity: .65; pointer-events: none; }
body.dimmed #app { filter: blur(6px); }

/* ===== Сайдбар ===== */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: rgba(255,255,255,.28); }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 18px 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 9px; border-radius: 999px;
  background: #fff; box-shadow: var(--lift); font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); transition: background .2s, transform .2s var(--ease); }
.icon-btn:hover { background: rgba(255,255,255,.8); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 19px; height: 19px; }
.me-btn { width: 36px; height: 36px; }
.search { margin: 4px 18px 8px; position: relative; }
.search input { width: 100%; height: 40px; border-radius: 14px; border: 1px solid transparent; background: rgba(255,255,255,.62); padding: 0 14px 0 38px; outline: none; transition: background .2s, border-color .2s; }
.search input:focus { background: #fff; border-color: var(--line); }
.search svg { position: absolute; left: 13px; top: 11px; width: 18px; height: 18px; color: var(--grey); }
.tabs { display: flex; gap: 4px; margin: 2px 18px 6px; padding: 4px; border-radius: 14px; background: rgba(26,33,51,.045); position: relative; }
.tabs button { flex: 1; height: 32px; border-radius: 10px; font-weight: 500; font-size: 14px; color: var(--grey); position: relative; z-index: 1; transition: color .25s; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs .thumb { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(26,33,51,.06), 0 6px 14px -8px rgba(26,33,51,.25); transition: transform .4s var(--ease); }
.tabs[data-tab="people"] .thumb { transform: translateX(calc(100% + 4px)); }
.list { flex: 1; overflow-y: auto; padding: 4px 10px 14px; scrollbar-width: thin; }
.row { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; text-align: left; transition: background .2s, transform .35s var(--ease), box-shadow .35s var(--ease); }
.row:hover { background: rgba(255,255,255,.55); }
.row.active { background: #fff; box-shadow: var(--lift); transform: translateY(-1px); }
.row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.row .sub { font-size: 13.5px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--grey); align-self: start; padding-top: 3px; }
.row.unread .sub { color: var(--ink-2); }
.dot { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 600; display: grid; place-items: center; }
.sect { padding: 12px 12px 6px; font-size: 13px; color: var(--grey); }

/* ===== Аватар-плитка ===== */
.ava { position: relative; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-weight: 600; font-size: 18px; color: var(--ink); flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 6px 14px -8px rgba(26,33,51,.35); }
.ava.sm { width: 32px; height: 32px; border-radius: 11px; font-size: 13px; }
.ava.md { width: 40px; height: 40px; border-radius: 13px; font-size: 15px; }
.ava.on::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%; background: #3ccf7a; border: 2.5px solid #fff; }
.ava.sm.on::after { width: 10px; height: 10px; border-width: 2px; }
.ava .mark { width: 24px; height: 24px; }

/* ===== Разговор ===== */
.conv { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.conv-top { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); min-height: 72px; }
.back { display: none; }
.title-wrap { min-width: 0; flex: 1; }
.c-title { font-weight: 500; font-size: 17px; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub { font-size: 13px; color: var(--grey); height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub.typing { color: var(--ink-2); }
.typing-dots i { display: inline-block; width: 4px; height: 4px; margin-left: 2px; border-radius: 50%; background: currentColor; animation: tdot 1.1s infinite; }
.typing-dots i:nth-child(2) { animation-delay: .15s; } .typing-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes tdot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
.word { display: inline-block; white-space: pre; animation: rise .34s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(12px); } to { opacity: 1; transform: none; filter: none; } }

.msgs { flex: 1; overflow-y: auto; padding: 18px 22px 10px; scroll-behavior: auto; scrollbar-width: thin; display: flex; flex-direction: column; }
.msgs-inner { margin-top: auto; display: flex; flex-direction: column; }
.day { align-self: center; margin: 14px 0 10px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: 0 1px 2px rgba(26,33,51,.05); font-size: 12.5px; color: var(--grey); }
.m { display: flex; gap: 8px; align-items: flex-end; max-width: min(620px, 82%); margin-top: 2px; position: relative; transition: filter .4s var(--ease), opacity .4s; }
.m.first { margin-top: 10px; }
.m.mine { align-self: flex-end; flex-direction: row-reverse; }
.m .ava-slot { width: 32px; flex: none; }
.m.mine .ava-slot { display: none; }
.m.enter { animation: rise .34s var(--ease) both; }
.b { position: relative; padding: 9px 13px 7px; border-radius: 20px; background: var(--glass-strong); border: 1px solid var(--edge);
  box-shadow: 0 1px 1px rgba(26,33,51,.03), 0 8px 18px -12px rgba(26,33,51,.28);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease); min-width: 64px; word-wrap: break-word; overflow-wrap: anywhere; }
.m:not(.mine).last .b { border-bottom-left-radius: 7px; }
.m.mine .b { background: var(--ink); color: #f4f5f8; border-color: var(--ink); }
.m.mine.last .b { border-bottom-right-radius: 7px; }
.m:hover .b { transform: translateY(-2px); box-shadow: 0 2px 2px rgba(26,33,51,.04), 0 16px 26px -14px rgba(26,33,51,.4); }
.b .who { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.b .txt { white-space: pre-wrap; }
.b .txt a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.b .foot { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 1px; font-size: 11px; color: var(--grey); float: right; margin-left: 10px; position: relative; top: 5px; }
.m.mine .b .foot { color: rgba(244,245,248,.55); }
.b.deleted .txt { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--grey); }
.m.mine .b.deleted .txt { color: rgba(244,245,248,.6); }
.b img.photo { display: block; width: 300px; max-width: 100%; height: auto; max-height: 360px; object-fit: cover; border-radius: 14px; margin: 2px -6px 4px; cursor: zoom-in; }
.quote { display: block; width: 100%; text-align: left; margin: 2px 0 6px; padding: 5px 10px; border-left: 3px solid currentColor; border-radius: 8px; background: rgba(26,33,51,.05); font-size: 13px; }
.m.mine .quote { background: rgba(255,255,255,.1); }
.quote b { display: block; font-weight: 600; font-size: 12.5px; }
.quote span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.m.mine .reacts { justify-content: flex-end; }
.rx { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,.85); border: 1px solid var(--line); font-size: 13px; transition: transform .25s var(--ease); }
.rx.me { background: var(--ink); color: #fff; border-color: var(--ink); }
.rx:active { transform: scale(.9); }
.rx.pop { animation: pop .38s var(--ease); }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.hover-bar { position: absolute; top: -14px; display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #fff; box-shadow: var(--lift); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .2s, transform .25s var(--ease); z-index: 3; }
.m:not(.mine) .hover-bar { right: -60px; } .m.mine .hover-bar { left: -60px; }
.m:hover .hover-bar { opacity: 1; transform: none; pointer-events: auto; }
.hover-bar button { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
.hover-bar button:hover { background: rgba(26,33,51,.06); }
.hover-bar svg { width: 16px; height: 16px; }
.m.flash .b { animation: flash 1.2s var(--ease); }
@keyframes flash { 0%, 30% { transform: translateY(-4px) scale(1.02); box-shadow: 0 0 0 3px rgba(26,33,51,.18), 0 20px 34px -16px rgba(26,33,51,.45); } }
/* Фокус: выбранное сообщение поднимается, остальное уходит в расфокус */
.msgs.focus .m { filter: blur(2.5px); opacity: .55; }
.msgs.focus .m.focused { filter: none; opacity: 1; z-index: 4; }
.msgs.focus .m.focused .b { transform: translateY(-6px) scale(1.02); box-shadow: 0 2px 3px rgba(26,33,51,.05), 0 28px 40px -18px rgba(26,33,51,.45); }

.empty-conv { margin: auto; text-align: center; padding: 40px 24px; color: var(--grey); max-width: 420px; }
.empty-conv .big { font-weight: 500; font-size: 30px; letter-spacing: -.025em; color: var(--ink); line-height: 1.1; }
.empty-conv .big .serif { color: var(--grey); font-size: 36px; display: block; }
.down { position: absolute; right: 22px; bottom: 96px; width: 44px; height: 44px; border-radius: 15px; background: #fff; box-shadow: var(--lift); display: grid; place-items: center; opacity: 0; transform: translateY(14px) scale(.9); pointer-events: none; transition: opacity .25s, transform .35s var(--ease); }
.down.show { opacity: 1; transform: none; pointer-events: auto; }
.down svg { width: 20px; height: 20px; }
.down .dot { position: absolute; top: -7px; right: -7px; }

/* ===== Ввод ===== */
.composer { padding: 10px 16px 16px; }
.reply-bar { align-items: center; gap: 10px; margin: 0 6px 8px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.7); border-left: 3px solid var(--ink); }
.reply-bar div { flex: 1; min-width: 0; font-size: 13px; }
.reply-bar b { display: block; font-weight: 600; }
.reply-bar span { display: block; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.input-row { display: flex; align-items: flex-end; gap: 8px; padding: 6px; border-radius: 20px; background: rgba(255,255,255,.82); border: 1px solid var(--edge); box-shadow: var(--lift); }
.input-row textarea { flex: 1; resize: none; border: 0; outline: none; background: none; padding: 9px 6px; max-height: 160px; min-height: 40px; line-height: 1.45; }
.send { width: 40px; height: 40px; border-radius: 14px; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .25s var(--ease), opacity .2s; }
.send:disabled { opacity: .25; cursor: default; }
.send:not(:disabled):active { transform: scale(.9); }
.send svg { width: 18px; height: 18px; }
.composer.off { pointer-events: none; opacity: .4; }

/* ===== Карточки поверх: вход, профиль, группа ===== */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; }
.overlay[hidden] { display: none; }
.card { width: min(460px, 100%); border-radius: var(--r); padding: 30px; animation: cardIn .6s var(--ease) both; max-height: calc(100vh - 40px); overflow: auto; }
.card.leaving { animation: cardOut .5s var(--ease) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(10px); } }
@keyframes cardOut { to { opacity: 0; transform: translateY(-14px) scale(1.04); filter: blur(12px); } }
.card h2 { margin: 18px 0 22px; font-weight: 500; font-size: 40px; line-height: 1.04; letter-spacing: -.035em; }
.card h2 .serif { display: block; color: var(--grey); font-size: 46px; letter-spacing: -.01em; line-height: 1; }
.card h3 { margin: 0 0 18px; font-weight: 500; font-size: 24px; letter-spacing: -.02em; }
.field { display: block; margin-bottom: 16px; }
.field span { display: block; font-size: 13px; color: var(--grey); margin-bottom: 6px; }
.field input { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.85); padding: 0 14px; outline: none; font-size: 16px; }
.field input:focus { border-color: rgba(26,33,51,.3); background: #fff; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 40px; height: 40px; border-radius: 13px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); transition: transform .25s var(--ease), box-shadow .25s; }
.colors button[aria-pressed="true"] { transform: translateY(-3px); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink), 0 10px 16px -8px rgba(26,33,51,.4); }
.primary { width: 100%; height: 50px; margin-top: 8px; border-radius: 16px; background: var(--ink); color: #fff; font-weight: 500; font-size: 16px; transition: transform .25s var(--ease), opacity .2s; }
.primary:disabled { opacity: .3; cursor: default; }
.primary:not(:disabled):active { transform: scale(.98); }
.ghost { width: 100%; height: 44px; margin-top: 8px; border-radius: 14px; color: var(--grey); }
.ghost:hover { background: rgba(26,33,51,.04); color: var(--ink); }
.pick { max-height: 280px; overflow: auto; margin: 0 -8px 8px; }
.pick label { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; cursor: pointer; }
.pick label:hover { background: rgba(255,255,255,.7); }
.pick input { margin-left: auto; width: 18px; height: 18px; accent-color: var(--ink); }

/* Меню сообщения */
.menu { position: fixed; z-index: 30; min-width: 220px; padding: 6px; border-radius: 18px; background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid var(--edge); box-shadow: var(--wide); animation: cardIn .3s var(--ease) both; }
.menu[hidden] { display: none; }
.menu .emo { display: flex; gap: 2px; padding: 4px 4px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .emo button { width: 34px; height: 34px; border-radius: 11px; font-size: 19px; transition: transform .2s var(--ease); }
.menu .emo button:hover { transform: translateY(-3px) scale(1.15); }
.menu .it { display: flex; width: 100%; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 11px; text-align: left; }
.menu .it:hover { background: rgba(26,33,51,.06); }
.menu .it svg { width: 17px; height: 17px; color: var(--ink-2); }
.menu .it.danger { color: #d23c3c; } .menu .it.danger svg { color: #d23c3c; }

.viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(242,243,246,.7); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); cursor: zoom-out; }
.viewer[hidden] { display: none; }
.viewer { touch-action: none; }
.viewer img { will-change: transform; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.vclose { position: absolute; top: calc(14px + var(--sat)); right: 14px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: var(--lift); display: grid; place-items: center; color: var(--ink); animation: rise .35s var(--ease) .15s both; }
.vclose svg { width: 20px; height: 20px; }
.viewer img { max-width: 92vw; max-height: 90vh; border-radius: 20px; box-shadow: var(--wide); animation: cardIn .45s var(--ease); }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(26px + var(--sab)); transform: translateX(-50%); padding: 11px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; box-shadow: var(--wide); animation: rise .34s var(--ease); }
.toast[hidden] { display: none; }

/* ===== Телефон ===== */
/* ===== Жидкая отправка ===== */
.goo-layer { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
.goo-layer .goo { position: absolute; inset: 0; filter: url(#goo); }
.goo-layer .drop, .goo-layer .neck { position: absolute; left: 0; top: 0; will-change: transform, width, height; }
.goo-layer .gtext { position: absolute; left: 0; top: 0; padding: 9px 13px 7px; white-space: pre-wrap; overflow-wrap: anywhere; will-change: transform; }
.m.settle .b { animation: settle .42s var(--ease); }
@keyframes settle { 0% { transform: scale(1.03, .94); } 55% { transform: scale(.985, 1.02); } 100% { transform: none; } }

/* ===== Галочки как в Телеграме ===== */
.chk { width: 17px; height: 13px; flex: none; overflow: visible; }
.chk path { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chk .c2 { stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .35s var(--ease) .05s; }
.chk.read .c2 { stroke-dashoffset: 0; }
.chk.draw .c1 { stroke-dasharray: 16; animation: draw .3s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
.chk.read { color: #9fd8ff; }
.chk.draw2 .c2 { animation: draw2 .4s var(--ease) both; transition: none; }
@keyframes draw2 { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
.dot.still { animation: none; }
.row .chk.read { color: #3a9be0; }
.row .chk { color: var(--grey); width: 16px; height: 12px; margin-right: 3px; vertical-align: -1px; }
.clock { width: 13px; height: 13px; flex: none; }
.clock circle { fill: none; stroke: currentColor; stroke-width: 1.6; }
.clock line { stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; transform-origin: 6.5px 6.5px; }
.clock .h1 { animation: spin 1.2s linear infinite; } .clock .h2 { animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Переходы ===== */
#app { animation: appIn .9s var(--ease) both; }
@keyframes appIn { from { opacity: 0; transform: translateY(26px) scale(.975); filter: blur(10px); } }
.tile { animation: tileIn 1.1s var(--ease) both, bob 9s ease-in-out 1.1s infinite alternate; }
@keyframes tileIn { from { opacity: 0; transform: translateY(40px) scale(.6) rotate(-12deg); } }
.row.in { animation: rise .45s var(--ease) both; }
.list.from-right { animation: slideR .45s var(--ease) both; }
.list.from-left { animation: slideL .45s var(--ease) both; }
@keyframes slideR { from { opacity: 0; transform: translateX(34px); filter: blur(6px); } }
@keyframes slideL { from { opacity: 0; transform: translateX(-34px); filter: blur(6px); } }
.dot { animation: pop .4s var(--ease) both; }
.c-sub > * , .c-sub { transition: color .3s; }
.c-sub.swap { animation: rise .32s var(--ease) both; }
.reply-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--ease), opacity .3s; opacity: 0; }
.reply-wrap.show { grid-template-rows: 1fr; opacity: 1; }
.reply-wrap > div { min-height: 0; overflow: hidden; }
.reply-bar { display: flex; animation: none; }
.input-row { transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .3s; }
.input-row:focus-within { transform: translateY(-2px); background: #fff; box-shadow: 0 2px 3px rgba(26,33,51,.04), 0 18px 34px -16px rgba(26,33,51,.32); }
.send { transition: transform .4s var(--ease), opacity .25s, background .3s; }
.send:disabled { transform: scale(.84); }
.send svg { transition: transform .4s var(--ease); }
.send:not(:disabled):hover svg { transform: translateY(-2px); }
.menu .it, .menu .emo button { animation: rise .32s var(--ease) both; }
.menu.out { animation: cardOut .22s var(--ease) both; }
.toast.out { animation: cardOut .3s var(--ease) both; }
.b.squash { animation: squash .32s var(--ease) both; }
@keyframes squash { to { transform: scale(.82); opacity: 0; filter: blur(8px); } }
.b .txt.swap { animation: rise .32s var(--ease) both; }
.day { position: sticky; top: 6px; z-index: 2; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.icon-btn, .row, .rx, .colors button, .ghost, .primary, .pill { transition: background .25s, transform .3s var(--ease), box-shadow .3s var(--ease), color .25s, opacity .25s; }
.pill:hover { transform: translateY(-1px); }
.overlay { transition: background .4s; }
.empty-conv p { animation: rise .5s var(--ease) .6s both; }
.viewer.out { animation: fadeOut .3s var(--ease) both; }
@keyframes fadeOut { to { opacity: 0; } }

/* ===== Аватарки ===== */
.ava { overflow: visible; }
.ava img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.ava .emo { font-size: 1.25em; line-height: 1; }
.ava.xl { width: 112px; height: 112px; border-radius: 36px; font-size: 44px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 24px 40px -18px rgba(26,33,51,.45); }
.ava.xl.on::after { width: 20px; height: 20px; border-width: 4px; right: 2px; bottom: 2px; }
.m .ava-slot .ava, #cHead { cursor: pointer; }
#cHead { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; text-align: left; border-radius: 16px; padding: 4px 8px 4px 4px; margin: -4px 0 -4px -4px; transition: background .25s; }
#cHead:hover { background: rgba(255,255,255,.55); }
.ae-top { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
.ae-btns { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.chip { height: 36px; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,.85); border: 1px solid var(--line); font-weight: 500; font-size: 14px; transition: transform .3s var(--ease), background .25s; }
.chip:hover { background: #fff; transform: translateY(-1px); }
.ae-label { font-size: 13px; color: var(--grey); margin: 6px 0 6px; }
.ae-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
.ae-grid button { aspect-ratio: 1; border-radius: 12px; font-size: 22px; background: rgba(255,255,255,.6); transition: transform .3s var(--ease), background .2s, box-shadow .25s; }
.ae-grid button:hover { transform: translateY(-2px) scale(1.06); background: #fff; }
.ae-grid button[aria-pressed="true"] { background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.ae-grid .ae-letter { font-size: 15px; font-weight: 600; }
textarea.bio { width: 100%; min-height: 76px; resize: vertical; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.85); padding: 12px 14px; outline: none; font-size: 15px; }
textarea.bio:focus { border-color: rgba(26,33,51,.3); background: #fff; }
.mail-line { font-size: 13px; color: var(--grey); margin: -4px 0 14px; }
/* Профиль собеседника */
.pv { text-align: center; }
.pv-ava { display: flex; justify-content: center; margin: 6px 0 14px; }
.pv-name { margin: 0 !important; font-size: 28px !important; letter-spacing: -.025em; animation: rise .45s var(--ease) .08s both; }
.pv-status { color: var(--grey); font-size: 14px; margin-top: 2px; animation: rise .45s var(--ease) .14s both; }
.pv-bio { margin: 16px auto 20px; max-width: 32em; font-size: 16px; white-space: pre-wrap; animation: rise .45s var(--ease) .2s both; }
.pv-bio.empty { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--grey); }
.pv-list { text-align: left; margin: 14px -8px 6px; }

/* ===== Вход по коду ===== */
.auth { position: relative; overflow: hidden; }
.steps { display: grid; }
.step { grid-area: 1 / 1; visibility: hidden; opacity: 0; transform: translateX(40px); filter: blur(8px); transition: opacity .38s var(--ease), transform .45s var(--ease), filter .4s var(--ease), visibility 0s .45s; }
.step.on { visibility: visible; opacity: 1; transform: none; filter: none; transition: opacity .38s var(--ease) .08s, transform .5s var(--ease) .08s, filter .4s var(--ease) .08s, visibility 0s; }
.step.leave { transform: translateX(-40px); }
.hint { color: var(--grey); margin: -10px 0 18px; font-size: 14.5px; }
.err { color: #d23c3c; font-size: 14px; margin: -6px 0 10px; animation: rise .3s var(--ease); }
.otp { display: flex; gap: 8px; margin: 4px 0 16px; }
.otp input { width: 100%; min-width: 0; height: 58px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.88); text-align: center; font-size: 26px; font-weight: 600; outline: none; transition: border-color .2s, box-shadow .25s, transform .25s var(--ease); }
.otp input:focus { border-color: rgba(26,33,51,.4); box-shadow: 0 10px 20px -12px rgba(26,33,51,.4); transform: translateY(-2px); background: #fff; }
.links { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
.link { color: var(--grey); font-size: 14px; padding: 6px 2px; transition: color .2s; }
.link:hover:not(:disabled) { color: var(--ink); }
.link:disabled { opacity: .6; cursor: default; }
.primary.busy { position: relative; color: transparent; }
.primary.busy::after { content: ""; position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }

/* ===== Эмодзи и стикеры ===== */
.composer { position: relative; }
#emoBtn.on { background: #fff; color: var(--ink); }
.picker { position: absolute; z-index: 6; right: 16px; bottom: calc(100% - 4px); width: 380px; height: 400px; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; transform-origin: 90% 100%; animation: pickIn .38s var(--ease) both; background: rgba(255,255,255,.93); }
.picker.out { animation: pickOut .22s var(--ease) both; }
@keyframes pickIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
@keyframes pickOut { to { opacity: 0; transform: translateY(10px) scale(.97); } }
.picker.glass { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: 0 2px 4px rgba(26,33,51,.04), 0 30px 70px -24px rgba(26,33,51,.32); }
.pk-sec { content-visibility: auto; contain-intrinsic-size: auto 260px; }
.pk-pane[hidden] { display: none; }
.pk-tabs { display: flex; gap: 4px; padding: 8px 8px 4px; }
.pk-tabs button { flex: 1; height: 32px; border-radius: 10px; font-weight: 500; font-size: 14px; color: var(--grey); transition: background .25s, color .25s; }
.pk-tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(26,33,51,.06), 0 6px 14px -8px rgba(26,33,51,.25); }
.pk-body { flex: 1; overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; }
.pk-body.swap { animation: pkSwap .25s var(--ease) both; }
@keyframes pkSwap { from { opacity: 0; transform: translateY(8px); } }
.pk-h { padding: 8px 6px 6px; font-size: 12.5px; color: var(--grey); }
.pk-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.pk-grid button { aspect-ratio: 1; border-radius: 10px; font-size: 24px; line-height: 1; transition: transform .15s var(--ease), background .12s; }
.pk-grid button:hover { background: rgba(26,33,51,.06); transform: scale(1.12); }
.pk-grid.stk { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pk-grid.stk button { border-radius: 14px; padding: 4px; }
.pk-grid.stk img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pk-grid.stk button:hover { transform: scale(1.08) rotate(-3deg); }
.pk-cats { display: flex; gap: 2px; padding: 6px 8px 8px; border-top: 1px solid var(--line); overflow-x: auto; }
.pk-cats button { width: 36px; height: 36px; flex: none; border-radius: 10px; font-size: 19px; display: grid; place-items: center; transition: background .2s, transform .2s var(--ease); }
.pk-cats button:hover, .pk-cats button.on { background: rgba(26,33,51,.07); }
.pk-cats img { width: 28px; height: 28px; }
/* Стикеры и крупные эмодзи в ленте */
.b.sticker, .b.jumbo { background: none !important; border-color: transparent !important; box-shadow: none !important; padding: 0; }
.m:hover .b.sticker, .m:hover .b.jumbo { transform: translateY(-3px) rotate(-1.5deg); box-shadow: none; }
.b.sticker .stk { width: 168px; height: 168px; display: block; }
.b.jumbo .txt { font-size: 52px; line-height: 1.15; }
.b.sticker .foot, .b.jumbo .foot { float: none; position: absolute; right: 2px; bottom: 2px; top: auto; padding: 2px 8px; border-radius: 999px; background: rgba(26,33,51,.55); color: #fff !important; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.b.jumbo .foot, .b.sticker .foot { position: static; display: inline-flex; margin: 2px 0 0; }
.b.jumbo, .b.sticker { display: flex; flex-direction: column; align-items: flex-end; }
.m:not(.mine) .b.jumbo, .m:not(.mine) .b.sticker { align-items: flex-start; }
.m.mine .b.sticker .who, .b.sticker .who { display: none; }
.stk-fly { position: fixed; z-index: 16; pointer-events: none; width: 168px; height: 168px; }

/* ===== Обои ===== */
.wall { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.wall-layer { position: absolute; inset: 0; }
.conv > :not(.wall) { position: relative; z-index: 1; }
.conv > .down { position: absolute; }
.conv.walled .conv-top { background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); }
.conv.dark .day, .conv.dark .m .b .who { }
.conv.dark .day { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; }
.conv.dark.walled .conv-top { background: rgba(20,25,38,.55); border-color: rgba(255,255,255,.08); }
.conv.dark .c-title, .conv.dark .conv-top .icon-btn { color: #fff; }
.conv.dark .c-sub { color: rgba(255,255,255,.6); }
.conv.dark #cHead:hover { background: rgba(255,255,255,.08); }
.conv.dark .empty-conv, .conv.dark .empty-conv .big { color: #fff; }
.conv.dark .empty-conv .big .serif { color: rgba(255,255,255,.7); }
.wgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.wtile { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); transition: transform .35s var(--ease), box-shadow .3s; }
.wtile:hover { transform: translateY(-3px); }
.wtile.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink), 0 14px 24px -14px rgba(26,33,51,.5); }
.wtile span { position: absolute; left: 8px; bottom: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.85); font-size: 12.5px; font-weight: 500; }
.wtile.up { display: grid; place-items: center; background: repeating-linear-gradient(135deg, rgba(26,33,51,.04) 0 8px, transparent 8px 16px); }
.wtile.up span { position: static; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14.5px; margin-bottom: 4px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }

/* ===== Эффекты отправки ===== */
.fxmenu { position: absolute; z-index: 7; right: 16px; bottom: calc(100% - 4px); width: 250px; padding: 8px; border-radius: 20px; background: rgba(255,255,255,.95); box-shadow: 0 2px 4px rgba(26,33,51,.04), 0 30px 70px -24px rgba(26,33,51,.35); transform-origin: 90% 100%; animation: pickIn .32s var(--ease) both; }
.fxmenu.glass { -webkit-backdrop-filter: none; backdrop-filter: none; }
.fxmenu.out { animation: pickOut .2s var(--ease) both; }
.fx-h { font-size: 12.5px; color: var(--grey); padding: 4px 8px 6px; }
.fxmenu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 42px; padding: 0 10px; border-radius: 12px; text-align: left; font-weight: 500; animation: rise .3s var(--ease) both; transition: background .15s; }
.fxmenu button:hover { background: rgba(26,33,51,.06); }
.fxmenu button span { font-size: 21px; width: 26px; text-align: center; transition: transform .25s var(--ease); }
.fxmenu button:hover span { transform: scale(1.25) rotate(-8deg); }
.send.holding { transform: scale(.88); }
.fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 18; pointer-events: none; }
.fx-spot { position: fixed; inset: 0; z-index: 17; pointer-events: none; }
.fxi { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 2px; font-size: 12px; line-height: 1; border-radius: 6px; transition: transform .25s var(--ease); cursor: pointer; }
.fxi:hover { transform: scale(1.3) rotate(-10deg); }
.b .txt.spoiler { color: transparent !important; cursor: pointer; border-radius: 6px; background-image: radial-gradient(circle, rgba(26,33,51,.75) .9px, transparent 1.4px), radial-gradient(circle, rgba(26,33,51,.45) .7px, transparent 1.2px); background-size: 7px 7px, 11px 9px; animation: shimmer 1.4s linear infinite; }
.m.mine .b .txt.spoiler { background-image: radial-gradient(circle, rgba(255,255,255,.9) .9px, transparent 1.4px), radial-gradient(circle, rgba(255,255,255,.55) .7px, transparent 1.2px); }
.b .txt.spoiler a { color: transparent; text-decoration: none; }
@keyframes shimmer { to { background-position: 7px -7px, -11px 9px; } }
.b .txt.reveal { animation: reveal .6s var(--ease) both; }
@keyframes reveal { from { filter: blur(8px); opacity: .2; letter-spacing: .12em; } }

@media (max-width: 760px) {
  .picker { left: 8px; right: 8px; width: auto; height: 340px; }
  .b.sticker .stk { width: 140px; height: 140px; }
  .ae-grid { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 760px) {
  #app { width: 100vw; height: 100dvh; border-radius: 0; border: 0; grid-template-columns: 100% 100%; transition: filter .7s var(--ease), opacity .6s; }
  .side, .conv { grid-row: 1; grid-column: 1; transition: transform .5s var(--ease), filter .5s var(--ease); }
  .side { padding-top: var(--sat); }
  .conv { transform: translateX(100%); background: rgba(248,249,251,.9); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: -20px 0 50px -30px rgba(26,33,51,.35); }
  #app.in-chat .conv { transform: none; }
  #app.in-chat .side { transform: translateX(-28%); filter: blur(4px); }
  .back { display: grid; }
  .conv-top { padding: calc(10px + var(--sat)) 12px 10px; }
  .msgs { padding: 14px 12px 8px; }
  .m { max-width: 88%; }
  .hover-bar { display: none; }
  .composer { padding: 8px 10px calc(10px + var(--sab)); }
  .tile { display: none; }
  .card { padding: 24px; }
  .card h2 { font-size: 34px; } .card h2 .serif { font-size: 40px; }
  .down { bottom: calc(86px + var(--sab)); right: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ===== Телефоны ===== */
html { -webkit-text-size-adjust: 100%; }
body { overscroll-behavior: none; }
.msgs, .list, .pk-body, .pick { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
button, .row, .rx, .chip, .wtile { touch-action: manipulation; }
.m.swiping { transition: none !important; }
.m .swipe-ico { position: absolute; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: var(--lift); display: grid; place-items: center; opacity: 0; transform: scale(.4); pointer-events: none; }
.m .swipe-ico svg { width: 16px; height: 16px; color: var(--ink); }
.m:not(.mine) .swipe-ico { right: -40px; } .m.mine .swipe-ico { right: -40px; }
@media (max-width: 760px) {
  /* Высота по видимой части экрана: клавиатура не перекрывает поле ввода */
  #app { height: var(--app-h, 100dvh); }
  /* Поля от 16px — iPhone не приближает страницу при вводе */
  .input-row textarea, .search input, .field input, textarea.bio, .otp input { font-size: 16px; }
  /* Лёгкая графика: без тяжёлого размытия и бесконечных анимаций фона */
  .bokeh i { animation: none; filter: blur(40px); }
  #app.glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: #f6f7f9; }
  .conv { -webkit-backdrop-filter: none; backdrop-filter: none; background: #f7f8fa; }
  .conv.walled .conv-top { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255,255,255,.92); }
  .conv.dark.walled .conv-top { background: rgba(20,25,38,.94); }
  .day { -webkit-backdrop-filter: none; backdrop-filter: none; }
  #app.in-chat .side { filter: none; opacity: .5; }
  .side-top { padding: calc(14px + var(--sat)) 14px 8px; }
  .search { margin: 4px 14px 8px; } .tabs { margin: 2px 14px 6px; }
  .list { padding: 4px 6px calc(14px + var(--sab)); }
  .row { padding: 9px 8px; border-radius: 16px; }
  .icon-btn { width: 40px; height: 40px; }
  .send { width: 42px; height: 42px; }
  .input-row { border-radius: 22px; }
  .m { max-width: 86%; }
  .b { padding: 8px 12px 6px; }
  .reply-bar { margin: 0 2px 8px; }
  /* Карточки — шторками снизу */
  .overlay:not(#onboard) { align-items: end; padding: 0; }
  .overlay:not(#onboard) .card { width: 100%; max-height: 92dvh; border-radius: 26px 26px 0 0; padding: 14px 20px calc(18px + var(--sab)); animation: sheetIn .45s var(--ease) both; }
  .overlay:not(#onboard) .card.leaving { animation: sheetOut .32s var(--ease) both; }
  .overlay:not(#onboard) .card::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: rgba(26,33,51,.18); margin: 0 auto 14px; }
  #onboard { padding: 14px; align-items: center; }
  #onboard .card { padding: 22px 20px; }
  .otp { gap: 6px; } .otp input { height: 54px; font-size: 24px; border-radius: 14px; }
  .wgrid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .wtile span { font-size: 11px; left: 5px; bottom: 5px; padding: 2px 7px; }
  /* Меню сообщения — шторкой снизу */
  .menu { left: 8px !important; right: 8px; top: auto !important; bottom: calc(8px + var(--sab)); min-width: 0; border-radius: 22px; padding: 8px; animation: sheetIn .38s var(--ease) both; }
  .menu.out { animation: sheetOut .25s var(--ease) both; }
  .menu .emo { justify-content: space-between; }
  .menu .emo button { width: 44px; height: 44px; font-size: 24px; }
  .menu .it { height: 48px; font-size: 16px; }
  .fxmenu { left: 8px; right: 8px; width: auto; }
  .fxmenu button { height: 48px; font-size: 16px; }
  .pk-grid button { font-size: 26px; }
  .picker { bottom: calc(100% + 2px); background: #fff; }
  .pk-body { background: #fff; }
}
@keyframes sheetIn { from { transform: translateY(105%); } }
@keyframes sheetOut { to { transform: translateY(105%); } }
@media (max-width: 380px) {
  .m { max-width: 90%; }
  .ava.sm { width: 28px; height: 28px; } .m .ava-slot { width: 28px; }
  .card h2 { font-size: 30px; } .card h2 .serif { font-size: 34px; }
  .msgs { padding: 12px 8px 6px; }
}

/* ===== Как в приложении: без выделения текста ===== */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img, video, svg { -webkit-user-drag: none; user-drag: none; }

/* ===== Фото с размытым превью ===== */
.photo-wrap { position: relative; display: block; width: min(300px, 100%); border-radius: 14px; overflow: hidden; margin: 2px -6px 4px; background: rgba(26,33,51,.08); cursor: zoom-in; }
.photo-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; transition: filter .45s var(--ease), transform .6s var(--ease); }
.photo-wrap.loading img { filter: blur(14px); transform: scale(1.08); }
.photo-wrap .spin-ring { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .8s linear infinite; }
.photo-wrap:not(.loading) .spin-ring { display: none; }

/* ===== Голосовые ===== */
.voice { display: flex; align-items: center; gap: 10px; min-width: 220px; padding: 2px 0 2px; }
.vplay { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .25s var(--ease), background .3s; }
.m.mine .vplay { background: #f4f5f8; color: var(--ink); }
.vplay:active { transform: scale(.9); }
.vplay svg { width: 18px; height: 18px; }
.vplay .ic-pause { display: none; }
.voice.playing .vplay .ic-play { display: none; } .voice.playing .vplay .ic-pause { display: block; }
.voice.loading .vplay svg { opacity: 0; } .voice.loading .vplay { background-image: radial-gradient(circle, transparent 55%, transparent 56%); }
.voice.loading .vplay::after { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; position: absolute; }
.vbody { flex: 1; min-width: 0; }
.vwave { display: flex; align-items: center; gap: 2px; height: 28px; cursor: pointer; }
.vwave i { flex: 1; min-width: 2px; max-width: 3px; border-radius: 2px; background: rgba(26,33,51,.22); transition: background .15s; }
.m.mine .vwave i { background: rgba(244,245,248,.35); }
.vwave i.on { background: var(--ink); }
.m.mine .vwave i.on { background: #fff; }
.vmeta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--grey); margin-top: 2px; }
.m.mine .vmeta { color: rgba(244,245,248,.6); }
.vspeed { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: rgba(26,33,51,.08); color: inherit; transition: transform .2s var(--ease); }
.m.mine .vspeed { background: rgba(255,255,255,.14); }
.vspeed:active { transform: scale(.9); }

/* ===== Видео-кружки ===== */
.b.vnote-b { background: none !important; border-color: transparent !important; box-shadow: none !important; padding: 0; }
.m:hover .b.vnote-b { transform: none; }
.vnote { position: relative; width: 220px; height: 220px; border-radius: 50%; overflow: hidden; background: #d9dce3; cursor: pointer; transition: width .45s var(--ease), height .45s var(--ease), box-shadow .35s; box-shadow: 0 10px 26px -14px rgba(26,33,51,.45); -webkit-mask-image: -webkit-radial-gradient(white, black); }
.vnote.big { width: 300px; height: 300px; }
.vnote video, .vnote img.vposter { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vnote img.vposter { filter: blur(6px); transform: scale(1.1); transition: opacity .4s; }
.vnote.ready img.vposter { opacity: 0; }
.vnote svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
.vnote svg.ring circle { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; opacity: 0; transition: opacity .3s; }
.vnote.big svg.ring circle { opacity: .95; }
.vn-time { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 2px 9px; border-radius: 999px; background: rgba(26,33,51,.55); color: #fff; font-size: 12px; }
.vn-mute { position: absolute; right: 18%; bottom: 10px; width: 22px; height: 22px; border-radius: 50%; background: rgba(26,33,51,.55); display: grid; place-items: center; transition: opacity .3s, transform .3s var(--ease); }
.vn-mute svg { width: 12px; height: 12px; color: #fff; }
.vnote.big .vn-mute { opacity: 0; transform: scale(.5); }
.b.vnote-b .foot { position: static; display: inline-flex; float: none; margin-top: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(26,33,51,.55); color: #fff !important; }
.b.vnote-b { display: flex; flex-direction: column; align-items: flex-end; }
.m:not(.mine) .b.vnote-b { align-items: flex-start; }

/* ===== Запись ===== */
.rec-btn { width: 40px; height: 40px; border-radius: 14px; background: var(--ink); color: #fff; display: grid; place-items: center; position: relative; touch-action: none; transition: transform .35s var(--ease), border-radius .35s var(--ease), background .3s; }
.rec-btn svg { width: 19px; height: 19px; position: absolute; transition: transform .35s var(--ease), opacity .25s; }
.rec-btn .ic-cam { opacity: 0; transform: scale(.4) rotate(-40deg); }
.rec-btn.cam .ic-cam { opacity: 1; transform: none; } .rec-btn.cam .ic-mic { opacity: 0; transform: scale(.4) rotate(40deg); }
.rec-btn.hot { transform: scale(1.75); border-radius: 50%; background: #e5484d; z-index: 3; }
.rec-btn .pulse { position: absolute; inset: -4px; border-radius: 50%; background: rgba(229,72,77,.25); transform: scale(var(--lvl, 1)); opacity: 0; transition: transform .08s linear, opacity .2s; pointer-events: none; }
.rec-btn.hot .pulse { opacity: 1; }
.input-row .send[hidden], .input-row .rec-btn[hidden] { display: none !important; }
.sendswap { animation: swapIn .3s var(--ease) both; }
@keyframes swapIn { from { transform: scale(.4) rotate(-30deg); opacity: 0; } }
.recbar { position: absolute; inset: 0; display: none; align-items: center; gap: 12px; padding: 0 64px 0 14px; border-radius: 20px; background: #fff; z-index: 2; }
.composer.recording .recbar { display: flex; animation: rise .25s var(--ease) both; }
.recdot { width: 10px; height: 10px; border-radius: 50%; background: #e5484d; animation: blinkdot 1s ease-in-out infinite; flex: none; }
@keyframes blinkdot { 50% { opacity: .25; } }
.rectime { font-variant-numeric: tabular-nums; font-weight: 500; min-width: 42px; }
.reclive { flex: 1; height: 26px; display: flex; align-items: center; gap: 2px; overflow: hidden; justify-content: flex-end; }
.reclive i { width: 3px; flex: none; border-radius: 2px; background: #e5484d; opacity: .75; }
.rechint { color: var(--grey); font-size: 13.5px; white-space: nowrap; transition: transform .1s linear, opacity .2s; }
.rechint b { font-weight: 500; }
.reccancel { color: #d23c3c; font-weight: 500; font-size: 14.5px; padding: 6px 8px; display: none; }
.composer.locked .reccancel { display: inline-block; } .composer.locked .rechint { display: none; }
.reclock { position: absolute; right: 22px; bottom: 74px; width: 40px; height: 64px; border-radius: 20px; background: #fff; box-shadow: var(--lift); display: none; flex-direction: column; align-items: center; justify-content: space-around; padding: 6px 0; z-index: 3; animation: rise .3s var(--ease) both; }
.reclock svg { width: 18px; height: 18px; color: var(--grey); }
.composer.recording:not(.locked) .reclock { display: flex; }
.reclock .arrow { animation: bobup 1.2s ease-in-out infinite; }
@keyframes bobup { 50% { transform: translateY(-4px); } }
.composer.locked .rec-btn { transform: none; border-radius: 14px; background: var(--ink); }
.composer.locked .rec-btn .pulse { opacity: 0; }
/* Камера для кружка */
.camstage { position: fixed; inset: 0; z-index: 16; display: grid; place-items: center; background: rgba(15,18,28,.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); animation: fadeIn .25s ease both; pointer-events: none; }
.camstage.out { animation: fadeOut .25s ease both; }
@keyframes fadeIn { from { opacity: 0; } }
.camcircle { position: relative; width: min(78vw, 340px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: #000; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); animation: camIn .45s var(--ease) both; -webkit-mask-image: -webkit-radial-gradient(white, black); }
@keyframes camIn { from { transform: scale(.4); opacity: 0; } }
.camcircle video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.camring { position: absolute; width: calc(min(78vw, 340px) + 18px); aspect-ratio: 1; transform: rotate(-90deg); }
.camring circle { fill: none; stroke: #e5484d; stroke-width: 4; stroke-linecap: round; }
.camtime { position: absolute; top: calc(50% + min(39vw, 170px) + 22px); color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ===== Истории ===== */
.stories { display: flex; gap: 12px; overflow-x: auto; padding: 4px 12px 10px; margin: 0 -4px 4px; scrollbar-width: none; scroll-snap-type: x proximity; }
.stories::-webkit-scrollbar { display: none; }
.st { flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px; scroll-snap-align: start; animation: rise .4s var(--ease) both; }
.st-ring { display: block; position: relative; width: 62px; height: 62px; border-radius: 50%; padding: 5px; background: conic-gradient(from 210deg, #FFD21F, #ff6b8a, #b48cff, #7c9cff, #3ccf7a, #FFD21F); transition: transform .3s var(--ease); }
.st-ring.seen { background: rgba(26,33,51,.16); }
.st-ring.none { background: transparent; }
.st:active .st-ring { transform: scale(.92); }
.st-ring .ava { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 2.5px #f6f7f9; font-size: 22px; }
.st-ring .ava img { border-radius: 50%; }
.st-ring .ava.on::after { display: none; }
.st-plus { position: absolute; right: -1px; bottom: -1px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; border: 2.5px solid #f6f7f9; }
.st-plus svg { width: 12px; height: 12px; }
.st-name { font-size: 12px; max-width: 66px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.story { position: fixed; inset: 0; z-index: 35; background: #0d0f16; display: flex; align-items: center; justify-content: center; touch-action: none; }
.story[hidden] { display: none; }
.story-frame { position: relative; width: min(100vw, calc(var(--app-h, 100dvh) * 9 / 16)); height: var(--app-h, 100dvh); max-height: 100dvh; overflow: hidden; background: #000; border-radius: 0; }
@media (min-width: 761px) { .story-frame { height: min(92vh, 860px); width: calc(min(92vh, 860px) * 9 / 16); border-radius: 22px; } }
.story-media { position: absolute; inset: 0; display: grid; place-items: center; }
.story-media img { width: 100%; height: 100%; object-fit: cover; }
.story-text { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px 28px; text-align: center; font-weight: 600; font-size: clamp(26px, 7vw, 38px); line-height: 1.2; color: #fff; letter-spacing: -.02em; white-space: pre-wrap; word-break: break-word; }
.story-cap { position: absolute; left: 0; right: 0; bottom: 92px; padding: 12px 18px; text-align: center; color: #fff; font-size: 16px; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.story-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + var(--sat)) 12px 30px; background: linear-gradient(rgba(0,0,0,.45), transparent); z-index: 2; }
.story-bars { display: flex; gap: 4px; }
.story-bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); overflow: hidden; }
.story-bars i b { display: block; height: 100%; width: 0; background: #fff; }
.story-head { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: #fff; }
.story-head .ava { width: 36px; height: 36px; border-radius: 50%; font-size: 15px; box-shadow: none; }
.story-head .ava img { border-radius: 50%; }
.story-head .nm { font-weight: 600; font-size: 15px; } .story-head .ago { font-size: 13px; opacity: .7; margin-left: 4px; font-weight: 400; }
.story-head .sp { flex: 1; }
.story-head button { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.story-head button:hover { background: rgba(255,255,255,.12); }
.story-head svg { width: 20px; height: 20px; }
.story-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 12px calc(14px + var(--sab)); background: linear-gradient(transparent, rgba(0,0,0,.5)); display: flex; gap: 8px; align-items: center; z-index: 2; }
.story-bottom input { flex: 1; height: 46px; border-radius: 23px; border: 1.5px solid rgba(255,255,255,.55); background: rgba(255,255,255,.08); color: #fff; padding: 0 18px; outline: none; font-size: 16px; }
.story-bottom input::placeholder { color: rgba(255,255,255,.7); }
.story-bottom .qr { width: 42px; height: 42px; font-size: 24px; border-radius: 50%; transition: transform .25s var(--ease); }
.story-bottom .qr:active { transform: scale(1.3); }
.story-bottom .views { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 500; padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,.14); }
.story-bottom .views svg { width: 18px; height: 18px; }
.story-bottom .sp { flex: 1; }
.story-bottom .del { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.14); }
.story-bottom .del svg { width: 18px; height: 18px; }
.story-viewers { position: absolute; left: 0; right: 0; bottom: 0; max-height: 60%; background: #fff; border-radius: 22px 22px 0 0; z-index: 4; padding: 14px 12px calc(14px + var(--sab)); overflow: auto; animation: sheetIn .35s var(--ease) both; }
.story-viewers h4 { margin: 4px 8px 10px; font-weight: 500; }
.story-fly { position: fixed; z-index: 36; border-radius: 50%; overflow: hidden; pointer-events: none; }
/* Создание истории */
.stc { position: fixed; inset: 0; z-index: 34; background: #0d0f16; display: flex; align-items: center; justify-content: center; animation: fadeIn .3s ease both; }
.stc[hidden] { display: none; }
.stc .story-frame { display: flex; flex-direction: column; }
.stc-text { position: absolute; inset: 0; display: grid; place-items: center; padding: 60px 26px 140px; }
.stc-text textarea { width: 100%; background: none; border: 0; outline: none; resize: none; color: #fff; text-align: center; font-weight: 600; font-size: clamp(26px, 7vw, 36px); line-height: 1.2; letter-spacing: -.02em; }
.stc-text textarea::placeholder { color: rgba(255,255,255,.55); }
.stc-cols { position: absolute; left: 0; right: 0; bottom: 84px; display: flex; justify-content: center; gap: 10px; z-index: 3; }
.stc-cols button { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.7); transition: transform .25s var(--ease); }
.stc-cols button[aria-pressed="true"] { transform: scale(1.25); border-color: #fff; }
.stc-cap { position: absolute; left: 14px; right: 14px; bottom: 84px; z-index: 3; }
.stc-cap input { width: 100%; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,.4); color: #fff; padding: 0 16px; outline: none; font-size: 16px; }
.stc-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px calc(14px + var(--sab)); display: flex; gap: 10px; z-index: 3; }
.stc-bar button { height: 48px; border-radius: 16px; padding: 0 18px; font-weight: 500; }
.stc-bar .cancel { background: rgba(255,255,255,.14); color: #fff; }
.stc-bar .pub { flex: 1; background: #fff; color: var(--ink); }
.stc-top { position: absolute; top: calc(12px + var(--sat)); left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 3; }
.stc-top button { height: 34px; padding: 0 14px; border-radius: 999px; color: #fff; background: rgba(255,255,255,.14); font-weight: 500; font-size: 14px; }
.stc-top button[aria-pressed="true"] { background: #fff; color: var(--ink); }
/* Сообщение-ответ на историю */
.story-ref { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; padding: 5px; border-radius: 12px; background: rgba(26,33,51,.06); font-size: 12.5px; }
.m.mine .story-ref { background: rgba(255,255,255,.1); }
.story-ref .th { width: 34px; height: 54px; border-radius: 7px; background-size: cover; background-position: center; flex: none; display: grid; place-items: center; color: #fff; font-size: 9px; padding: 3px; overflow: hidden; text-align: center; }

/* ===== Упоминания и подсказки ===== */
.mention { color: inherit; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; text-decoration-color: rgba(124,156,255,.8); cursor: pointer; padding: 0; }
.m:not(.mine) .mention { color: #3a62e0; text-decoration: none; }
.m.mention-me .b { box-shadow: 0 0 0 2px rgba(124,156,255,.6), 0 8px 18px -12px rgba(26,33,51,.28); }
.suggest { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 4px); z-index: 6; padding: 6px; border-radius: 18px; background: #fff; box-shadow: 0 2px 4px rgba(26,33,51,.04), 0 24px 50px -20px rgba(26,33,51,.35); animation: pickIn .25s var(--ease) both; max-height: 260px; overflow: auto; }
.suggest[hidden] { display: none; }
.suggest button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 12px; text-align: left; }
.suggest button:hover, .suggest button.on { background: rgba(26,33,51,.06); }
.suggest .u { color: var(--grey); font-size: 13px; }

/* ===== Профиль-экран ===== */
.prof { position: fixed; inset: 0; z-index: 25; display: flex; justify-content: flex-end; }
.prof[hidden] { display: none; }
.prof-dim { position: absolute; inset: 0; background: rgba(15,18,28,.28); animation: fadeIn .3s ease both; }
.prof.out .prof-dim { animation: fadeOut .3s ease both; }
.prof-sheet { position: relative; width: min(440px, 100vw); height: var(--app-h, 100dvh); background: #f6f7f9; box-shadow: -30px 0 80px -30px rgba(26,33,51,.4); display: flex; flex-direction: column; animation: profIn .42s var(--ease) both; overflow: hidden; }
.prof.out .prof-sheet { animation: profOut .3s var(--ease) both; }
@keyframes profIn { from { transform: translateX(105%); } }
@keyframes profOut { to { transform: translateX(105%); } }
@media (min-width: 761px) { .prof-sheet { height: calc(100vh - 32px); margin: 16px; border-radius: 26px; } }
.prof-bar { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 6px; padding: calc(10px + var(--sat)) 10px 10px; transition: background .2s; }
.prof-bar.solid { background: rgba(246,247,249,.94); box-shadow: 0 1px 0 var(--line); }
.prof-bar .icon-btn { color: var(--pb-c, #fff); background: rgba(0,0,0,.14); border-radius: 50%; transition: color .2s, background .2s; }
.prof-bar.solid .icon-btn { --pb-c: var(--ink); background: transparent; }
.prof-bar .pt { flex: 1; font-weight: 500; font-size: 17px; opacity: var(--tk, 0); transform: translateY(calc((1 - var(--tk, 0)) * 8px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof-bar .tbtn { height: 36px; padding: 0 14px; border-radius: 12px; font-weight: 500; color: var(--pb-c, #fff); background: rgba(0,0,0,.14); }
.prof-bar.solid .tbtn { background: rgba(26,33,51,.06); }
.prof-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.prof-hero { position: relative; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 22px; color: #fff; overflow: hidden; }
.prof-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(30px) saturate(1.4); transform: translateY(calc(var(--sy, 0) * .45px)) scale(1.15); }
.prof-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.05), rgba(0,0,0,.35)); }
.prof-ava { position: relative; z-index: 1; transform: translateY(calc(var(--sy, 0) * .35px)) scale(calc(1 - var(--k, 0) * .45)); opacity: calc(1 - var(--k, 0) * 1.2); transform-origin: 50% 100%; }
.prof-ava .ava { width: 118px; height: 118px; border-radius: 50%; font-size: 46px; box-shadow: 0 0 0 4px rgba(255,255,255,.75), 0 24px 40px -18px rgba(0,0,0,.5); cursor: zoom-in; }
.prof-ava .ava img { border-radius: 50%; }
.prof-ava .ava.on::after { width: 22px; height: 22px; right: 4px; bottom: 4px; border-width: 4px; }
.prof-ava .st-ring { width: 130px; height: 130px; padding: 7px; }
.prof-ava .st-ring .ava { width: 100%; height: 100%; box-shadow: 0 0 0 3.5px #fff; }
.prof-ava .st-ring.none .ava { box-shadow: 0 0 0 4px rgba(255,255,255,.75), 0 24px 40px -18px rgba(0,0,0,.5); }
.prof-bar.solid { --pb-c: var(--ink); }
.prof-name { position: relative; z-index: 1; margin-top: 14px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; text-shadow: 0 1px 12px rgba(0,0,0,.3); transform: translateY(calc(var(--sy, 0) * .25px)); opacity: calc(1 - var(--k, 0) * 1.3); text-align: center; padding: 0 20px; }
.prof-sub { position: relative; z-index: 1; font-size: 14px; opacity: calc(.85 - var(--k, 0)); margin-top: 2px; transform: translateY(calc(var(--sy, 0) * .25px)); }
.prof-acts { display: flex; gap: 8px; padding: 14px 16px 4px; }
.prof-acts button { flex: 1; height: 58px; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(26,33,51,.05); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 500; color: var(--ink); transition: transform .25s var(--ease), background .2s; animation: rise .4s var(--ease) both; }
.prof-acts button:active { transform: scale(.95); }

/* ===== Истории ===== */
const ST_BG = ["linear-gradient(160deg,#ff9a8b,#ff6a88 55%,#ff99ac)", "linear-gradient(160deg,#7c9cff,#b48cff)", "linear-gradient(160deg,#3ccf7a,#1fa2a6)", "linear-gradient(160deg,#FFD21F,#ff8a3c)", "linear-gradient(160deg,#1a2133,#3a4a7a)", "linear-gradient(160deg,#f6d365,#fda085)", "linear-gradient(160deg,#0f2027,#2c5364)"];

  if (!(history.state && history.state.prof)) history.pushState(Object.assign({}, history.state, { prof: 1 }), "", location.href);
  drawProfile(); $("#profScroll").scrollTop = 0; onProfScroll();
  requestAnimationFrame(() => flyAva($("#cAva .ava"), $("#profScroll .prof-ava .ava")));
}
function heroBg(u, color) { return u && u.ava ? `url("${u.ava}")` : `radial-gradient(circle at 30% 30%, #fff 0, ${color || COLORS[0]} 45%, ${color || COLORS[0]} 100%)`; }
function drawProfile() {
  const box = $("#profScroll"), act = $("#profAct"), title = $("#profTitle");
  if (PROF.group) {
    const rid = PROF.group, r = S.rooms[rid] || {}, ids = rid === GENERAL ? Object.keys(S.users) : Object.keys(r.members || {});
    title.textContent = roomTitle(r, rid); act.hidden = true;
    box.innerHTML = `<div class="prof-hero"><div class="prof-bg" style="background:${rid === GENERAL ? "linear-gradient(160deg,#c9d6ff,#eadcff)" : esc(r.color || COLORS[3])}"></div><div class="prof-ava">${roomAva(r, rid, "xl")}</div><div class="prof-name"></div><div class="prof-sub">${ids.length} ${plural(ids.length, "участник", "участника", "участников")}, ${ids.filter(online).length} в сети</div></div>
      <div class="prof-sec"><h4>Участники</h4>${ids.sort((a, b) => online(b) - online(a)).map((u, i) => `<button class="row" data-u="${esc(u)}" style="animation:riseLite .35s ${EASE} ${i * 25}ms both">${avaHTML(u, "md")}<span style="min-width:0"><span class="name" style="display:block">${esc((S.users[u] || {}).name || "Без имени")}${u === me.uid ? ' <span class="serif" style="color:var(--grey);font-size:16px">вы</span>' : ""}</span><span class="sub" style="display:block">${S.users[u] && S.users[u].username ? "@" + esc(S.users[u].username) + ", " : ""}${online(u) ? "в сети" : esc(lastSeen((S.users[u] || {}).seen))}</span></span><span></span></button>`).join("")}</div>
      ${r.type === "group" ? `<div class="prof-sec"><button class="it" data-pa="leave" style="color:#d23c3c">Покинуть группу</button></div>` : ""}<div class="prof-pad"></div>`;
    box.querySelector(".prof-name").textContent = roomTitle(r, rid);
    return;
  }
  const uid = PROF.uid, u = profUser(uid), mine = uid === me.uid, st = activeStories(uid);
  title.textContent = u.name || ""; act.hidden = !mine; act.textContent = PROF.edit ? "Готово" : "Изменить";
  const ringCls = st.length ? (mine || hasUnseen(uid) ? "" : "seen") : "none";
  const joined = u.joined ? new Date(u.joined) : null;
  let h = `<div class="prof-hero"><div class="prof-bg" style="background:${esc(heroBg(u, u.color))};background-size:cover;background-position:center"></div><div class="prof-ava"><span class="st-ring ${ringCls}" data-pa="ava">${avaHTML(mine ? null : uid, "xl", u.name, u.color, { ava: u.ava, emoji: u.emoji })}</span></div><div class="prof-name"></div><div class="prof-sub">${mine ? "это вы" : online(uid) ? "в сети" : esc(lastSeen(u.seen))}</div></div>`;
  if (PROF.edit) {
    h += `<div class="prof-sec prof-edit"><div class="field" style="padding:14px 16px" id="peAva"></div></div>
      <div class="prof-sec prof-edit"><label class="field"><span>Имя</span><input id="peName" maxlength="28"></label>
      <label class="field uname"><span>Имя пользователя</span><span class="uwrap"><input id="peUser" maxlength="24" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="nikitka"></span><div class="uname-st" id="peUserSt">По нему вас смогут найти и упомянуть. Латиница, цифры и _, от 4 символов.</div></label>
      <label class="field"><span>О себе</span><textarea class="bio" id="peBio" maxlength="160" placeholder="Пара слов о себе"></textarea></label></div>
      <div class="prof-sec"><div class="it"><div class="v">${esc(me.email || "")}</div><div class="l">Почта, видна только вам</div></div><button class="it" data-pa="logout" style="color:#d23c3c">Выйти из аккаунта</button></div>`;
  } else {
    const acts = mine
      ? [["edit", "i-edit", "Изменить"], ["story", "i-plus", "История"], ["walls", "i-wall", "Обои"]]
      : [["dm", "i-msg", "Написать"]].concat(u.username ? [["copy", "i-at", "Ник"]] : []).concat(st.length ? [["stories", "i-eye", "Истории"]] : []);
    h += `<div class="prof-acts">${acts.map(([a, ic, t], i) => `<button data-pa="${a}" style="animation-delay:${60 + i * 40}ms"><svg><use href="#${ic}"/></svg>${t}</button>`).join("")}</div>`;
    h += `<div class="prof-sec" style="animation-delay:120ms">${u.bio ? `<div class="it"><div class="v" id="pBio"></div><div class="l">О себе</div></div>` : `<div class="it"><div class="v empty">${mine ? "Расскажите о себе." : "Пока ничего о себе не рассказал(а)."}</div></div>`}
      ${u.username ? `<button class="it" data-pa="copy"><div class="v">@${esc(u.username)}</div><div class="l">Имя пользователя, нажмите, чтобы скопировать</div></button>` : mine ? `<button class="it" data-pa="edit"><div class="v" style="color:#3a62e0">Придумать @имя</div><div class="l">Чтобы вас было легко найти</div></button>` : ""}
      ${joined ? `<div class="it"><div class="v">${joined.getDate()} ${MONTHS[joined.getMonth()]} ${joined.getFullYear()}</div><div class="l">В Перерыве с</div></div>` : ""}</div>`;
    if (st.length) h += `<div class="prof-sec" style="animation-delay:170ms"><h4>Истории</h4><div class="prof-stories">${st.map((s, i) => `<button data-pst="${i}" style="${s.type === "text" ? "background:" + ST_BG[s.bg || 0] : `background-image:url('${esc(s.th || "")}')`}">${s.type === "text" ? esc((s.text || "").slice(0, 40)) : ""}</button>`).join("")}</div></div>`;
    if (!mine) {
      const groups = Object.keys(S.rooms).filter((rid) => S.rooms[rid].type === "group" && S.rooms[rid].members && S.rooms[rid].members[me.uid] && S.rooms[rid].members[uid]);
      if (groups.length) h += `<div class="prof-sec" style="animation-delay:220ms"><h4>Общие группы</h4>${groups.map((rid) => `<button class="row" data-room="${esc(rid)}">${roomAva(S.rooms[rid], rid, "md")}<span style="min-width:0"><span class="name" style="display:block">${esc(roomTitle(S.rooms[rid], rid))}</span><span class="sub" style="display:block">${Object.keys(S.rooms[rid].members || {}).length} участников</span></span><span></span></button>`).join("")}</div>`;
    }
  }
  box.innerHTML = h + '<div class="prof-pad"></div>';
  box.querySelector(".prof-name").textContent = u.name || "Без имени";
  const bio = box.querySelector("#pBio"); if (bio) bio.textContent = u.bio;
  if (PROF.edit) {
    const stt = { color: me.color, emoji: me.emoji || "", ava: me.ava || "", name: me.name };
    PROF.st = stt; avatarEditor($("#peAva"), stt, () => { const bg = box.querySelector(".prof-bg"); bg.style.background = heroBg(stt, stt.color); bg.style.backgroundSize = "cover"; const a = box.querySelector(".prof-ava"); a.innerHTML = `<span class="st-ring none">${avaHTML(null, "xl", stt.name, stt.color, { ava: stt.ava, emoji: stt.emoji })}</span>`; });
    $("#peName").value = me.name; $("#peBio").value = me.bio || ""; $("#peUser").value = me.username || "";
    $("#peName").oninput = () => { stt.name = $("#peName").value; stt.redraw(); box.querySelector(".prof-name").textContent = stt.name || " "; };
    let ut = 0; $("#peUser").oninput = () => {
      const inp = $("#peUser"); inp.value = inp.value.toLowerCase().replace(/[^a-z0-9_]/g, ""); const v = inp.value, st2 = $("#peUserSt");
      clearTimeout(ut); PROF.uOk = !v || v === me.username;
      if (!v) { st2.className = "uname-st"; st2.textContent = "Можно оставить пустым."; return; }
      if (!UNAME.test(v)) { st2.className = "uname-st bad"; st2.textContent = "От 4 до 24 символов: латиница, цифры, _"; PROF.uOk = false; return; }
      if (v === me.username) { st2.className = "uname-st ok"; st2.textContent = "Это ваше имя пользователя"; return; }
      st2.className = "uname-st"; st2.textContent = "Проверяем…";
      ut = setTimeout(async () => { const who = await req("GET", "/usernames/" + v).catch(() => "?"); if ($("#peUser").value !== v) return; PROF.uOk = !who || who === me.uid; st2.className = "uname-st " + (PROF.uOk ? "ok" : "bad"); st2.textContent = PROF.uOk ? "Свободно" : "Уже занято"; }, 380);
    };
  }
}
async function saveProfile() {
  const name = $("#peName").value.trim(); if (!name) { toast("Имя не может быть пустым"); return; }
  const un = $("#peUser").value.trim();
  if (un && (!UNAME.test(un) || PROF.uOk === false)) { toast("Выберите другое имя пользователя"); return; }
  const st = PROF.st, act = $("#profAct"); act.disabled = true;
  try {
    const u = { ["users/" + me.uid + "/name"]: name, ["users/" + me.uid + "/color"]: st.color, ["users/" + me.uid + "/emoji"]: st.emoji || "", ["users/" + me.uid + "/ava"]: st.ava || "", ["users/" + me.uid + "/bio"]: $("#peBio").value.trim() };
    const old = me.username || "";
    if (un !== old) { if (un) u["usernames/" + un] = me.uid; if (old) u["usernames/" + old] = null; u["users/" + me.uid + "/username"] = un || null; }
    await req("PATCH", "", u);
    Object.assign(me, { name, color: st.color, emoji: st.emoji || "", ava: st.ava || "", bio: $("#peBio").value.trim(), username: un }); saveMe();
    renderMe(); storiesSig = ""; renderStories();
    PROF.edit = false; drawProfile(); toast("Профиль сохранён");
  } catch (e) { toast(e.denied ? "Это имя пользователя уже занято" : "Не получилось сохранить"); }
  finally { act.disabled = false; }
}
function closeProfile() { if ($("#prof").hidden) return; if (history.state && history.state.prof) history.back(); else hideProfile(); }
function hideProfile() { const ov = $("#prof"); if (ov.hidden || ov.classList.contains("out")) return; ov.classList.add("out"); setTimeout(() => { ov.hidden = true; ov.classList.remove("out"); }, 300); }
addEventListener("popstate", () => { if (!$("#prof").hidden && !(history.state && history.state.prof)) hideProfile(); });
$("#profBack").onclick = () => { if (PROF.edit) { PROF.edit = false; drawProfile(); return; } closeProfile(); };
$("#prof .prof-dim").onclick = closeProfile;
$("#profAct").onclick = () => { if (PROF.edit) saveProfile(); else { PROF.edit = true; drawProfile(); $("#profScroll").scrollTo({ top: 200, behavior: "smooth" }); } };
function onProfScroll() {
  const sc = $("#profScroll"), y = sc.scrollTop, hero = sc.querySelector(".prof-hero"); if (!hero) return;
  const k = Math.min(1, Math.max(0, y / 220));
  hero.style.setProperty("--sy", y); hero.style.setProperty("--k", k.toFixed(3));
  const bar = $("#profBar"); bar.classList.toggle("solid", y > 230); bar.style.setProperty("--tk", Math.min(1, Math.max(0, (y - 200) / 60)).toFixed(3));
}
$("#profScroll").addEventListener("scroll", () => requestAnimationFrame(onProfScroll), { passive: true });
$("#profScroll").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-pa], [data-u], [data-room], [data-pst]"); if (!b) return;
  if (b.dataset.u) { openProfile(b.dataset.u, b.querySelector(".ava")); return; }
  if (b.dataset.room) { closeProfile(); setTimeout(() => { $("#tabs button[data-tab=chats]").click(); openRoom(b.dataset.room); }, 260); return; }
  if (b.dataset.pst) { const uid = PROF.uid; SVW.ui = 0; openStories(uid, b); SVW.si = Number(b.dataset.pst); showStory(); return; }
  const a = b.dataset.pa, uid = PROF.uid, u = profUser(uid);
  if (a === "dm") { closeProfile(); setTimeout(() => openDM(uid), 260); }
  if (a === "copy" && u.username) { try { await navigator.clipboard.writeText("@" + u.username); toast("Скопировано: @" + u.username); } catch (er) { toast("@" + u.username); } }
  if (a === "edit") { PROF.edit = true; drawProfile(); }
  if (a === "story") { closeProfile(); setTimeout(() => openStoryCreator(), 280); }
  if (a === "walls") { closeProfile(); setTimeout(() => $("#wallBtn").click(), 280); }
  if (a === "stories") openStories(uid, $("#profScroll .prof-ava .ava"));
  if (a === "ava") { if (activeStories(uid).length) openStories(uid, b.querySelector(".ava")); else if (u.ava) { const im = b.querySelector("img"); im && openViewer(im); } }
  if (a === "logout") { if (!confirm("Выйти из аккаунта на этом устройстве? Войти снова можно по коду с почты.")) return; localStorage.removeItem("chat.me"); saveSess(null); location.reload(); }
  if (a === "leave") { closeProfile(); setTimeout(() => $("#leave").click(), 280); }
});

/* ===== Запуск ===== */
function start() {
  document.body.classList.remove("locked");
  renderMe(); heartbeat(); setInterval(heartbeat, 25000);
  setInterval(() => { renderList(); if (S.room) renderHeader(false); }, 15000);
  stream("/users", "", (t) => {
    const stSig = Object.keys(t || {}).map((u) => (t[u] && t[u].story) || 0).join(",");
    S.users = t || {}; rebuildUnames();
    if (S.stSig != null && S.stSig !== stSig) loadStories(); S.stSig = stSig;
    const mu = S.users[me.uid]; if (mu && (mu.username || "") !== (me.username || "")) { me.username = mu.username || ""; saveMe(); }
    renderList(); if (S.room) { renderHeader(false); renderMsgs(); }
  }, authLost);
  // Истории меняются редко: опрашиваем, а не держим ещё один поток (браузер даёт хосту лишь 6 соединений)
  loadStories(); setInterval(() => { if (!document.hidden) loadStories(); }, 40000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadStories(); });
  stream("/rooms", "", (t) => { S.rooms = t || {}; renderList(); syncPreviews(); if (S.room) renderHeader(false); });
  stream("/reads", "", (t) => { S.reads = t || {}; renderList(); if (S.room) renderMsgs(); });
  stream("/typing", "", (t) => { S.typing = t || {}; renderList(); if (S.room) renderHeader(false); });
  setInterval(() => { if (Object.keys(S.typing).length) { renderList(); if (S.room) renderHeader(false); } }, 3000);
  const want = location.hash.slice(1);
  S.booting = true; openRoom(want && !isMobile() ? want : GENERAL); S.booting = false;
  if (isMobile()) $("#app").classList.remove("in-chat");
  // убираем «печатает» у себя, если ушли со страницы
  addEventListener("pagehide", () => { if (S.room && SESS) fetch(withAuth(DB + "/typing/" + S.room + "/" + me.uid + ".json", SESS.idToken), { method: "DELETE", keepalive: true }).catch(() => {}); });
}
if (me && me.uid && me.name && SESS && SESS.idToken && SESS.uid === me.uid) start(); else showOnboard(!!(me && me.name));
})();
