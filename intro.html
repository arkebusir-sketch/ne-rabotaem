/* ===== Палитра и время ===== */
const Y = "#FFD21F", N = "#0E1330", R = "#E8412C", K = "#000000", W = "#FFFFFF";
const BEAT = 0.5, DUR = 10;
const cam = document.getElementById("cam");

/* ===== Кривые: всё — функции времени ===== */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const L = (a, b, k) => a + (b - a) * k;
const sg = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => x <= 0 ? 0 : x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10));
const ei = (x) => x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x) - 1) / (Math.pow(2, 10) - 1);

if (MODE === "loop") window.ready.then(() => { const t0 = performance.now(); const loop = (n) => { seek((n - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
if (MODE === "embed") {
