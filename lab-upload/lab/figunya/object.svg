<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#F1E9FF"/>
      <stop offset=".28" stop-color="#B89BFF"/>
      <stop offset=".62" stop-color="#6B3FE0"/>
      <stop offset="1" stop-color="#24105E"/>
    </radialGradient>
    <radialGradient id="rim" cx="70%" cy="82%" r="55%">
      <stop offset="0" stop-color="#C4FC62" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#C4FC62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lobe" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE3F4"/>
      <stop offset=".35" stop-color="#FF8FD1"/>
      <stop offset=".8" stop-color="#9B2DB8"/>
      <stop offset="1" stop-color="#3A0F57"/>
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#E6FFB8"/>
      <stop offset=".5" stop-color="#C4FC62"/>
      <stop offset="1" stop-color="#4E7A12"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- кольцо сзади -->
  <ellipse cx="300" cy="318" rx="248" ry="70" fill="none" stroke="url(#ring)" stroke-width="26" transform="rotate(-18 300 318)" stroke-dasharray="390 1200" stroke-dashoffset="-560"/>

  <!-- основное тело: мягкая капля с буграми -->
  <path d="M300 92c78-6 150 38 178 110 22 56 6 96 28 146 20 46-4 104-58 128-50 22-92 4-140 18-56 16-116 12-156-30-38-40-34-90-60-132-28-46-16-110 30-150 44-38 96-28 132-56 14-12 28-32 46-34z" fill="url(#body)"/>
  <path d="M300 92c78-6 150 38 178 110 22 56 6 96 28 146 20 46-4 104-58 128-50 22-92 4-140 18-56 16-116 12-156-30-38-40-34-90-60-132-28-46-16-110 30-150 44-38 96-28 132-56 14-12 28-32 46-34z" fill="url(#rim)"/>

  <!-- розовый отросток -->
  <circle cx="452" cy="196" r="62" fill="url(#lobe)"/>
  <ellipse cx="436" cy="172" rx="22" ry="12" fill="url(#spec)" transform="rotate(-30 436 172)"/>

  <!-- кольцо спереди -->
  <ellipse cx="300" cy="318" rx="248" ry="70" fill="none" stroke="url(#ring)" stroke-width="26" transform="rotate(-18 300 318)" stroke-dasharray="560 1200" stroke-dashoffset="0"/>

  <!-- блики -->
  <ellipse cx="228" cy="168" rx="70" ry="34" fill="url(#spec)" transform="rotate(-24 228 168)"/>
  <circle cx="318" cy="134" r="10" fill="#fff" opacity=".85"/>

  <!-- лицо: объект слегка удивлён -->
  <g fill="#14092E">
    <ellipse cx="262" cy="292" rx="17" ry="24"/>
    <ellipse cx="342" cy="286" rx="17" ry="24"/>
    <ellipse cx="304" cy="358" rx="16" ry="12"/>
  </g>
  <circle cx="267" cy="283" r="6" fill="#fff"/>
  <circle cx="347" cy="277" r="6" fill="#fff"/>
  <ellipse cx="226" cy="334" rx="22" ry="11" fill="#FF8FD1" opacity=".55"/>
  <ellipse cx="384" cy="326" rx="22" ry="11" fill="#FF8FD1" opacity=".55"/>

  <!-- антенна -->
  <path d="M300 94c-4-30 8-52 30-62" fill="none" stroke="#24105E" stroke-width="7" stroke-linecap="round"/>
  <circle cx="334" cy="30" r="16" fill="#C4FC62"/>
  <circle cx="329" cy="25" r="5" fill="#fff" opacity=".9"/>
</svg>
