<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6f8">
<title>Перерыв</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a2133;
  --ink-2: #3a4152;
  --grey: #8b8b92;
  --line: rgba(26, 33, 51, .08);
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(255, 255, 255, .78);
  --edge: rgba(255, 255, 255, .9);
  --r: 24px;
  --lift: 0 1px 1px rgba(26,33,51,.04), 0 12px 32px -14px rgba(26,33,51,.22);
  --wide: 0 2px 4px rgba(26,33,51,.03), 0 40px 120px -30px rgba(26,33,51,.28);
  --serif: "Instrument Serif", "Cormorant Garamond", Georgia, serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Geist", "Inter", system-ui, sans-serif; font-weight: 400; font-size: 15px; line-height: 1.45;
  color: var(--ink); overflow: hidden;
  background: radial-gradient(120% 120% at 50% 45%, #f9fbfb 0%, #f6f7f8 45%, #f2f3f6 100%);
}
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 10px; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 500; }

/* ===== Пол студии: размытые плитки-логотипы за стеклом ===== */
.bokeh { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bokeh i { position: absolute; border-radius: 28%; animation: drift 26s ease-in-out infinite alternate; }
.bokeh i:nth-child(1) { width: 360px; height: 360px; left: -90px; bottom: -110px; background: #c9d6ff; filter: blur(70px); opacity: .9; }
.bokeh i:nth-child(2) { width: 300px; height: 300px; right: -70px; bottom: -80px; background: #ffd9c7; filter: blur(70px); animation-delay: -9s; }
.bokeh i:nth-child(3) { width: 220px; height: 220px; right: 18%; top: -90px; background: #cff1e1; filter: blur(60px); animation-delay: -4s; }
.bokeh i:nth-child(4) { width: 180px; height: 180px; left: 22%; top: 12%; background: #eadcff; filter: blur(64px); animation-delay: -15s; }
@keyframes drift { to { transform: translate(28px, -22px) rotate(8deg); } }

/* ===== Логотип ===== */
.mark { width: 22px; height: 22px; flex: none; }
.tile { position: fixed; z-index: 1; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
  background: linear-gradient(160deg, #ffffff, #eef0f5); box-shadow: var(--lift); pointer-events: none; animation: bob 9s ease-in-out infinite alternate; }
.tile .mark { width: 30px; height: 30px; }
.tile.soft { filter: blur(6px); opacity: .7; }
@keyframes bob { to { transform: translateY(-10px) rotate(-4deg); } }

/* ===== Окно ===== */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  border: 1px solid var(--edge); box-shadow: var(--wide);
}
#app {
  position: fixed; z-index: 2; inset: 0; margin: auto; width: min(1180px, calc(100vw - 64px)); height: min(780px, calc(100vh - 64px));
  border-radius: var(--r); display: grid; grid-template-columns: 340px 1fr; overflow: hidden;
  transition: filter .7s var(--ease), transform .9s var(--ease), opacity .6s;
}
body.locked #app { filter: blur(14px); transform: translateY(18px) scale(.97); opacity: .65; pointer-events: none; }
body.dimmed #app { filter: blur(6px); }

/* ===== Сайдбар ===== */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: rgba(255,255,255,.28); }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 18px 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 9px; border-radius: 999px;
  background: #fff; box-shadow: var(--lift); font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); transition: background .2s, transform .2s var(--ease); }
.icon-btn:hover { background: rgba(255,255,255,.8); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 19px; height: 19px; }
.me-btn { width: 36px; height: 36px; }
.search { margin: 4px 18px 8px; position: relative; }
.search input { width: 100%; height: 40px; border-radius: 14px; border: 1px solid transparent; background: rgba(255,255,255,.62); padding: 0 14px 0 38px; outline: none; transition: background .2s, border-color .2s; }
.search input:focus { background: #fff; border-color: var(--line); }
.search svg { position: absolute; left: 13px; top: 11px; width: 18px; height: 18px; color: var(--grey); }
.tabs { display: flex; gap: 4px; margin: 2px 18px 6px; padding: 4px; border-radius: 14px; background: rgba(26,33,51,.045); position: relative; }
.tabs button { flex: 1; height: 32px; border-radius: 10px; font-weight: 500; font-size: 14px; color: var(--grey); position: relative; z-index: 1; transition: color .25s; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs .thumb { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(26,33,51,.06), 0 6px 14px -8px rgba(26,33,51,.25); transition: transform .4s var(--ease); }
.tabs[data-tab="people"] .thumb { transform: translateX(calc(100% + 4px)); }
.list { flex: 1; overflow-y: auto; padding: 4px 10px 14px; scrollbar-width: thin; }
.row { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; text-align: left; transition: background .2s, transform .35s var(--ease), box-shadow .35s var(--ease); }
.row:hover { background: rgba(255,255,255,.55); }
.row.active { background: #fff; box-shadow: var(--lift); transform: translateY(-1px); }
.row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.row .sub { font-size: 13.5px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--grey); align-self: start; padding-top: 3px; }
.row.unread .sub { color: var(--ink-2); }
.dot { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 600; display: grid; place-items: center; }
.sect { padding: 12px 12px 6px; font-size: 13px; color: var(--grey); }

/* ===== Аватар-плитка ===== */
.ava { position: relative; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-weight: 600; font-size: 18px; color: var(--ink); flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 6px 14px -8px rgba(26,33,51,.35); }
.ava.sm { width: 32px; height: 32px; border-radius: 11px; font-size: 13px; }
.ava.md { width: 40px; height: 40px; border-radius: 13px; font-size: 15px; }
.ava.on::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%; background: #3ccf7a; border: 2.5px solid #fff; }
.ava.sm.on::after { width: 10px; height: 10px; border-width: 2px; }
.ava .mark { width: 24px; height: 24px; }

/* ===== Разговор ===== */
.conv { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.conv-top { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); min-height: 72px; }
.back { display: none; }
.title-wrap { min-width: 0; flex: 1; }
.c-title { font-weight: 500; font-size: 17px; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub { font-size: 13px; color: var(--grey); height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub.typing { color: var(--ink-2); }
.typing-dots i { display: inline-block; width: 4px; height: 4px; margin-left: 2px; border-radius: 50%; background: currentColor; animation: tdot 1.1s infinite; }
.typing-dots i:nth-child(2) { animation-delay: .15s; } .typing-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes tdot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
.word { display: inline-block; white-space: pre; animation: rise .34s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(12px); } to { opacity: 1; transform: none; filter: none; } }

.msgs { flex: 1; overflow-y: auto; padding: 18px 22px 10px; scroll-behavior: auto; scrollbar-width: thin; display: flex; flex-direction: column; }
.msgs-inner { margin-top: auto; display: flex; flex-direction: column; }
.day { align-self: center; margin: 14px 0 10px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: 0 1px 2px rgba(26,33,51,.05); font-size: 12.5px; color: var(--grey); }
.m { display: flex; gap: 8px; align-items: flex-end; max-width: min(620px, 82%); margin-top: 2px; position: relative; transition: filter .4s var(--ease), opacity .4s; }
.m.first { margin-top: 10px; }
.m.mine { align-self: flex-end; flex-direction: row-reverse; }
.m .ava-slot { width: 32px; flex: none; }
.m.mine .ava-slot { display: none; }
.m.enter { animation: rise .34s var(--ease) both; }
.b { position: relative; padding: 9px 13px 7px; border-radius: 20px; background: var(--glass-strong); border: 1px solid var(--edge);
  box-shadow: 0 1px 1px rgba(26,33,51,.03), 0 8px 18px -12px rgba(26,33,51,.28);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease); min-width: 64px; word-wrap: break-word; overflow-wrap: anywhere; }
.m:not(.mine).last .b { border-bottom-left-radius: 7px; }
.m.mine .b { background: var(--ink); color: #f4f5f8; border-color: var(--ink); }
.m.mine.last .b { border-bottom-right-radius: 7px; }
.m:hover .b { transform: translateY(-2px); box-shadow: 0 2px 2px rgba(26,33,51,.04), 0 16px 26px -14px rgba(26,33,51,.4); }
.b .who { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.b .txt { white-space: pre-wrap; }
.b .txt a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.b .foot { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 1px; font-size: 11px; color: var(--grey); float: right; margin-left: 10px; position: relative; top: 5px; }
.m.mine .b .foot { color: rgba(244,245,248,.55); }
.b.deleted .txt { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--grey); }
.m.mine .b.deleted .txt { color: rgba(244,245,248,.6); }
.b img.photo { display: block; width: 300px; max-width: 100%; height: auto; max-height: 360px; object-fit: cover; border-radius: 14px; margin: 2px -6px 4px; cursor: zoom-in; }
.quote { display: block; width: 100%; text-align: left; margin: 2px 0 6px; padding: 5px 10px; border-left: 3px solid currentColor; border-radius: 8px; background: rgba(26,33,51,.05); font-size: 13px; }
.m.mine .quote { background: rgba(255,255,255,.1); }
.quote b { display: block; font-weight: 600; font-size: 12.5px; }
.quote span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.m.mine .reacts { justify-content: flex-end; }
.rx { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 999px; background: rgba(255,255,255,.85); border: 1px solid var(--line); font-size: 13px; transition: transform .25s var(--ease); }
.rx.me { background: var(--ink); color: #fff; border-color: var(--ink); }
.rx:active { transform: scale(.9); }
.rx.pop { animation: pop .38s var(--ease); }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.hover-bar { position: absolute; top: -14px; display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #fff; box-shadow: var(--lift); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .2s, transform .25s var(--ease); z-index: 3; }
.m:not(.mine) .hover-bar { right: -60px; } .m.mine .hover-bar { left: -60px; }
.m:hover .hover-bar { opacity: 1; transform: none; pointer-events: auto; }
.hover-bar button { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
.hover-bar button:hover { background: rgba(26,33,51,.06); }
.hover-bar svg { width: 16px; height: 16px; }
.m.flash .b { animation: flash 1.2s var(--ease); }
@keyframes flash { 0%, 30% { transform: translateY(-4px) scale(1.02); box-shadow: 0 0 0 3px rgba(26,33,51,.18), 0 20px 34px -16px rgba(26,33,51,.45); } }
/* Фокус: выбранное сообщение поднимается, остальное уходит в расфокус */
.msgs.focus .m { filter: blur(2.5px); opacity: .55; }
.msgs.focus .m.focused { filter: none; opacity: 1; z-index: 4; }
.msgs.focus .m.focused .b { transform: translateY(-6px) scale(1.02); box-shadow: 0 2px 3px rgba(26,33,51,.05), 0 28px 40px -18px rgba(26,33,51,.45); }

.empty-conv { margin: auto; text-align: center; padding: 40px 24px; color: var(--grey); max-width: 420px; }
.empty-conv .big { font-weight: 500; font-size: 30px; letter-spacing: -.025em; color: var(--ink); line-height: 1.1; }
.empty-conv .big .serif { color: var(--grey); font-size: 36px; display: block; }
.down { position: absolute; right: 22px; bottom: 96px; width: 44px; height: 44px; border-radius: 15px; background: #fff; box-shadow: var(--lift); display: grid; place-items: center; opacity: 0; transform: translateY(14px) scale(.9); pointer-events: none; transition: opacity .25s, transform .35s var(--ease); }
.down.show { opacity: 1; transform: none; pointer-events: auto; }
.down svg { width: 20px; height: 20px; }
.down .dot { position: absolute; top: -7px; right: -7px; }

/* ===== Ввод ===== */
.composer { padding: 10px 16px 16px; }
.reply-bar { align-items: center; gap: 10px; margin: 0 6px 8px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.7); border-left: 3px solid var(--ink); }
.reply-bar div { flex: 1; min-width: 0; font-size: 13px; }
.reply-bar b { display: block; font-weight: 600; }
.reply-bar span { display: block; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.input-row { display: flex; align-items: flex-end; gap: 8px; padding: 6px; border-radius: 20px; background: rgba(255,255,255,.82); border: 1px solid var(--edge); box-shadow: var(--lift); }
.input-row textarea { flex: 1; resize: none; border: 0; outline: none; background: none; padding: 9px 6px; max-height: 160px; min-height: 40px; line-height: 1.45; }
.send { width: 40px; height: 40px; border-radius: 14px; background: var(--ink); color: #fff; display: grid; place-items: center; transition: transform .25s var(--ease), opacity .2s; }
.send:disabled { opacity: .25; cursor: default; }
.send:not(:disabled):active { transform: scale(.9); }
.send svg { width: 18px; height: 18px; }
.composer.off { pointer-events: none; opacity: .4; }

/* ===== Карточки поверх: вход, профиль, группа ===== */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; }
.overlay[hidden] { display: none; }
.card { width: min(460px, 100%); border-radius: var(--r); padding: 30px; animation: cardIn .6s var(--ease) both; max-height: calc(100vh - 40px); overflow: auto; }
.card.leaving { animation: cardOut .5s var(--ease) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(10px); } }
@keyframes cardOut { to { opacity: 0; transform: translateY(-14px) scale(1.04); filter: blur(12px); } }
.card h2 { margin: 18px 0 22px; font-weight: 500; font-size: 40px; line-height: 1.04; letter-spacing: -.035em; }
.card h2 .serif { display: block; color: var(--grey); font-size: 46px; letter-spacing: -.01em; line-height: 1; }
.card h3 { margin: 0 0 18px; font-weight: 500; font-size: 24px; letter-spacing: -.02em; }
.field { display: block; margin-bottom: 16px; }
.field span { display: block; font-size: 13px; color: var(--grey); margin-bottom: 6px; }
.field input { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.85); padding: 0 14px; outline: none; font-size: 16px; }
.field input:focus { border-color: rgba(26,33,51,.3); background: #fff; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 40px; height: 40px; border-radius: 13px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); transition: transform .25s var(--ease), box-shadow .25s; }
.colors button[aria-pressed="true"] { transform: translateY(-3px); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink), 0 10px 16px -8px rgba(26,33,51,.4); }
.primary { width: 100%; height: 50px; margin-top: 8px; border-radius: 16px; background: var(--ink); color: #fff; font-weight: 500; font-size: 16px; transition: transform .25s var(--ease), opacity .2s; }
.primary:disabled { opacity: .3; cursor: default; }
.primary:not(:disabled):active { transform: scale(.98); }
.ghost { width: 100%; height: 44px; margin-top: 8px; border-radius: 14px; color: var(--grey); }
.ghost:hover { background: rgba(26,33,51,.04); color: var(--ink); }
.pick { max-height: 280px; overflow: auto; margin: 0 -8px 8px; }
.pick label { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; cursor: pointer; }
.pick label:hover { background: rgba(255,255,255,.7); }
.pick input { margin-left: auto; width: 18px; height: 18px; accent-color: var(--ink); }

/* Меню сообщения */
.menu { position: fixed; z-index: 30; min-width: 220px; padding: 6px; border-radius: 18px; background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid var(--edge); box-shadow: var(--wide); animation: cardIn .3s var(--ease) both; }
.menu[hidden] { display: none; }
.menu .emo { display: flex; gap: 2px; padding: 4px 4px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .emo button { width: 34px; height: 34px; border-radius: 11px; font-size: 19px; transition: transform .2s var(--ease); }
.menu .emo button:hover { transform: translateY(-3px) scale(1.15); }
.menu .it { display: flex; width: 100%; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 11px; text-align: left; }
.menu .it:hover { background: rgba(26,33,51,.06); }
.menu .it svg { width: 17px; height: 17px; color: var(--ink-2); }
.menu .it.danger { color: #d23c3c; } .menu .it.danger svg { color: #d23c3c; }

.viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(242,243,246,.7); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); cursor: zoom-out; }
.viewer[hidden] { display: none; }
.viewer img { max-width: 92vw; max-height: 90vh; border-radius: 20px; box-shadow: var(--wide); animation: cardIn .45s var(--ease); }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(26px + var(--sab)); transform: translateX(-50%); padding: 11px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; box-shadow: var(--wide); animation: rise .34s var(--ease); }
.toast[hidden] { display: none; }

/* ===== Телефон ===== */
/* ===== Жидкая отправка ===== */
.goo-layer { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
.goo-layer .goo { position: absolute; inset: 0; filter: url(#goo); }
.goo-layer .drop, .goo-layer .neck { position: absolute; left: 0; top: 0; will-change: transform, width, height; }
.goo-layer .gtext { position: absolute; left: 0; top: 0; padding: 9px 13px 7px; white-space: pre-wrap; overflow-wrap: anywhere; will-change: transform; }
.m.settle .b { animation: settle .42s var(--ease); }
@keyframes settle { 0% { transform: scale(1.03, .94); } 55% { transform: scale(.985, 1.02); } 100% { transform: none; } }

/* ===== Галочки как в Телеграме ===== */
.chk { width: 17px; height: 13px; flex: none; overflow: visible; }
.chk path { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.chk .c2 { stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .35s var(--ease) .05s; }
.chk.read .c2 { stroke-dashoffset: 0; }
.chk.draw .c1 { stroke-dasharray: 16; animation: draw .3s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
.chk.read { color: #9fd8ff; }
.chk.draw2 .c2 { animation: draw2 .4s var(--ease) both; transition: none; }
@keyframes draw2 { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
.dot.still { animation: none; }
.row .chk.read { color: #3a9be0; }
.row .chk { color: var(--grey); width: 16px; height: 12px; margin-right: 3px; vertical-align: -1px; }
.clock { width: 13px; height: 13px; flex: none; }

/* ===== Аватарки ===== */
.ava { overflow: visible; }

/* Профиль собеседника */
.pv { text-align: center; }

/* ===== Вход по коду ===== */

/* ===== Эмодзи и стикеры ===== */
.composer { position: relative; }

function saveSess(x) { SESS = x; if (x) localStorage.setItem("chat.sess", JSON.stringify(x)); else localStorage.removeItem("chat.sess"); }

const withAuth = (url, t) => url + (t ? (url.includes("?") ? "&" : "?") + "auth=" + encodeURIComponent(t) : "");

/* ===== База: REST + поток событий ===== */
async function req(method, path, body) {
  const t = await token();
  const r = await fetch(withAuth(DB + path + ".json", t), { method, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { const e = new Error("denied"); e.denied = true; if (!t) authLost(); throw e; }
  if (!r.ok) throw new Error("db " + r.status);

function setAt(tree, path, val) {
  const parts = path.split("/").filter(Boolean);
  if (!parts.length) return val == null ? {} : val;
  if (tree == null || typeof tree !== "object") tree = {};
  let o = tree;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; }

let netShown = false;

function initial(n) { return (n || "?").trim().charAt(0).toUpperCase() || "?"; }

// Сжатие картинки в JPEG
async function shrink(file, max, q, limit, square) {
  const bmp = await createImageBitmap(file);

  if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
  const s = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement("canvas"); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  c.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
  let url = c.toDataURL("image/jpeg", q); while (url.length > limit && q > .35) { q -= .08; url = c.toDataURL("image/jpeg", q); }

}

    });
    inp.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !inp.value && i) { ins[i - 1].value = ""; ins[i - 1].focus(); } });
    inp.addEventListener("paste", (e) => { const t = (e.clipboardData.getData("text") || "").replace(/\D/g, ""); if (t) { e.preventDefault(); inp.value = t; inp.dispatchEvent(new Event("input")); } });
  });
})();
let verifying = false;
async function verifyCode() {
  const code = Array.from($("#otp").querySelectorAll("input")).map((i) => i.value).join("");
  if (code.length !== 6 || verifying) return; verifying = true;
  $("#auVerify").disabled = true; $("#auVerify").classList.add("busy");
  try {
    const r = await authCall({ action: "verify", email: auth.email, code });
    if (!r.ok) { authError("#auErr2", AUTH_ERR[r.err] || AUTH_ERR.server); $("#otp").querySelectorAll("input").forEach((i) => (i.value = "")); $("#otp input").focus(); return; }
    if (!r.idToken) { authError("#auErr2", "Сервер входа ещё не обновлён. Попросите администратора развернуть новую версию скрипта"); return; }
    auth.uid = r.uid; lost = false;
    saveSess({ uid: r.uid, idToken: r.idToken, refreshToken: r.refreshToken, exp: Date.now() + Number(r.expiresIn || 3600) * 1000 });
    let prof = null; try { prof = await req("GET", "/users/" + r.uid); } catch (e) {}
    if (prof && prof.name) {
      me = { uid: r.uid, email: auth.email, name: prof.name, color: prof.color || COLORS[0], emoji: prof.emoji || "", ava: prof.ava || "", bio: prof.bio || "" };
      saveMe(); closeCard($("#onboard"), start); return;
    }
    auth.st = { color: (me && me.color) || COLORS[Math.floor(Math.random() * 6)], emoji: (me && me.emoji) || "", ava: (me && me.ava) || "", name: (me && me.name) || "" };
    $("#auName").value = auth.st.name; $("#auBio").value = (me && me.bio) || "";
    avatarEditor($("#auAva"), auth.st);
    $("#auName").oninput = () => { auth.st.name = $("#auName").value; $("#auDone").disabled = !$("#auName").value.trim(); auth.st.redraw(); };
    $("#auName").oninput();
    goStep("profile");
  } catch (err) { authError("#auErr2", "Нет связи. Проверьте интернет"); }
  finally { verifying = false; $("#auVerify").disabled = false; $("#auVerify").classList.remove("busy"); }
}

/* ===== Запуск ===== */
function start() {
  document.body.classList.remove("locked");
  renderMe(); heartbeat(); setInterval(heartbeat, 25000);
  setInterval(() => { renderList(); if (S.room) renderHeader(false); }, 15000);
  stream("/users", "", (t) => { S.users = t || {}; renderList(); if (S.room) { renderHeader(false); renderMsgs(); } }, authLost);
  stream("/rooms", "", (t) => { S.rooms = t || {}; renderList(); syncPreviews(); if (S.room) renderHeader(false); });
  stream("/reads", "", (t) => { S.reads = t || {}; renderList(); if (S.room) renderMsgs(); });
  stream("/typing", "", (t) => { S.typing = t || {}; renderList(); if (S.room) renderHeader(false); });
  setInterval(() => { if (Object.keys(S.typing).length) { renderList(); if (S.room) renderHeader(false); } }, 3000);
  const want = location.hash.slice(1);
  openRoom(want && !isMobile() ? want : GENERAL);
  if (isMobile()) $("#app").classList.remove("in-chat");
  // убираем «печатает» у себя, если ушли со страницы
  addEventListener("pagehide", () => { if (S.room && SESS) fetch(withAuth(DB + "/typing/" + S.room + "/" + me.uid + ".json", SESS.idToken), { method: "DELETE", keepalive: true }).catch(() => {}); });
}
if (me && me.uid && me.name && SESS && SESS.idToken && SESS.uid === me.uid) start(); else showOnboard(!!(me && me.name));
})();
</script>
