<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Черновики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13110F;
    --board: #1F4D3A;      /* зелёная доска мастерской */
    --chalk: #EDEBE3;
    --dim: #9DB3A6;
    --pin: #FFD21F;        /* жёлтый сайта */
  }
  * { box-sizing: border-box; }
  html { background: var(--board); }
  body {
    margin: 0; min-height: 100vh; color: var(--chalk);
    font-family: "Golos Text", system-ui, sans-serif; font-size: 18px; line-height: 1.5;
    background:
      linear-gradient(rgba(237,235,227,.05) 1px, transparent 1px) 0 0 / 100% 32px,
      var(--board);
  }
  main { max-width: 1080px; margin: 0 auto; padding: 72px 28px 96px; }
  header { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding-bottom: 28px; border-bottom: 2px solid rgba(237,235,227,.18); }
  h1 { margin: 0; font-weight: 800; font-size: clamp(48px, 9vw, 112px); line-height: .95; letter-spacing: -.03em; }
  .lead { margin: 18px 0 0; max-width: 34em; color: var(--dim); }
  .count { font-weight: 800; font-size: clamp(48px, 9vw, 112px); line-height: .95; color: var(--pin); letter-spacing: -.03em; }
  .grid { list-style: none; margin: 40px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }
  .card { position: relative; }
  .card a {
    display: block; height: 100%; padding: 22px 22px 20px; color: var(--ink); text-decoration: none;
    background: var(--chalk); border-radius: 3px;
    transform: rotate(var(--r, 0deg)); transition: transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .card a::before { content: ""; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--pin); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .card a:hover, .card a:focus-visible { transform: rotate(0deg) translateY(-4px); }
  .card a:focus-visible { outline: 3px solid var(--pin); outline-offset: 4px; }
  .thumb { aspect-ratio: 16 / 10; border-radius: 2px; margin-bottom: 16px; overflow: hidden; background: var(--ink); }
  .thumb iframe { width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .card h2 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; }
  .card p { margin: 6px 0 0; font-size: 15px; color: #4A4640; }
  .card time { display: block; margin-top: 12px; font-size: 14px; color: #7A746A; }
  .empty { margin-top: 40px; padding: 40px; border: 2px dashed rgba(237,235,227,.3); border-radius: 3px; color: var(--dim); }
  footer { margin-top: 64px; color: var(--dim); font-size: 15px; }
  footer a { color: var(--chalk); }
  @media (prefers-reduced-motion: reduce) { .card a { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Черновики</h1>
      <p class="lead">Мастерская Никитки: здесь пробуются дизайны сайтов. С главной сюда ссылок нет, так что вы либо свой, либо очень любопытный.</p>
    </div>
    <div class="count" id="count" aria-label="Число черновиков">0</div>
  </header>

  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>Пока пусто. Первый черновик появится здесь.</p>

  <footer>Главный сайт: <a href="/">ne-rabotaem.ru</a></footer>
</main>

<script>
/*
  Список черновиков. Каждый черновик лежит в своей папке: /lab/<slug>/index.html
  Чтобы добавить новый: создать папку с index.html и дописать строку сюда.
  Поле url — если черновик лежит не в /lab/ (например, заставка).
*/
var DESIGNS = [
  { slug: "intro", url: "/intro.html", title: "Заставка «Рольставня»", note: "10 секунд моушена: ставня, часы, график, 3D-ларёк.", date: "2026-11-08" }
];

var grid = document.getElementById("grid");
var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function fmt(d) { var p = d.split("-"); return +p[2] + " " + MONTHS[+p[1] - 1] + " " + p[0]; }

DESIGNS.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (d, i) {
  var href = d.url || ("./" + d.slug + "/");
  var li = document.createElement("li"); li.className = "card";
  li.innerHTML =
    '<a href="' + href + '" style="--r:' + ((i % 3) - 1) * 1.2 + 'deg">' +
      '<div class="thumb"><iframe loading="lazy" tabindex="-1" aria-hidden="true" src="' + href + (href.indexOf("intro") >= 0 ? "?render&t=9.45" : "") + '"></iframe></div>' +
      '<h2></h2><p></p><time datetime="' + d.date + '">' + fmt(d.date) + '</time></a>';
  li.querySelector("h2").textContent = d.title;
  li.querySelector("p").textContent = d.note || "";
  grid.appendChild(li);
});
document.getElementById("count").textContent = DESIGNS.length;
document.getElementById("empty").hidden = DESIGNS.length > 0;

// Миниатюры: живая страница, уменьшенная под карточку
function sizeThumbs() {
  document.querySelectorAll(".thumb").forEach(function (t) {
    var f = t.querySelector("iframe"); f.style.transform = "scale(" + t.clientWidth / 1440 + ")";
  });
}
addEventListener("resize", sizeThumbs); sizeThumbs();
</script>
</body>
</html>
